<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NASA Mission Vending Machine</title><style>body{margin:0;background:radial-gradient(circle,#0f2747,#030712);font-family:Helvetica,Arial,sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}.machine{width:950px;height:700px;background:linear-gradient(180deg,#d8d8d8,#747474);border:10px solid #c53030;border-radius:24px;display:flex;padding:20px;box-shadow:0 0 60px #000}.window{flex:2;background:#0b1020;border:6px solid #666;border-radius:12px;position:relative;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:20px}.item{height:120px;background:rgba(255,255,255,.08);border:1px solid #5c6b86;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:52px;transition:.6s}.selected{transform:scale(1.25) translateY(180px);background:#d72638}.panel{flex:1;padding:20px}.worm{font-size:64px;color:#e43d30;font-weight:bold;letter-spacing:6px}.screen{background:black;color:#7cff7c;padding:12px;height:80px;border-radius:10px;margin:20px 0}.cardslot{background:#222;padding:15px;border-radius:12px;text-align:center;cursor:pointer}.swipecard{width:140px;height:80px;background:linear-gradient(135deg,#fff,#bbb);border-radius:10px;margin:15px auto;position:relative}.animate{animation:swipe 1.4s forwards}@keyframes swipe{0%{left:-120px}100%{left:120px;opacity:0}}.missionbtn{margin-top:15px;background:#e43d30;color:#fff;padding:12px;border:none;border-radius:10px;display:none;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center}.content{background:#fff;color:#000;width:800px;max-width:92%;max-height:85vh;overflow:auto;padding:24px;border-radius:16px}</style></head><body><div class='machine'><div class='window'><div class='grid' id='grid'></div></div><div class='panel'><div class='worm'>NASA</div><div class='screen' id='screen'>1975 Mission Archive Dispenser Ready</div><div class='cardslot' onclick='swipe()'>Swipe NASA Access Card<div class='swipecard' id='card'></div></div><button id='missionBtn' class='missionbtn'></button></div></div><div class='modal' id='modal'><div class='content'><button onclick='closeM()'>Close</button><div id='info'></div></div></div><script>const missions=[{name:'Apollo 11',rocket:'🚀',bullets:['First crewed lunar landing mission in July 1969.','Demonstrated Saturn V capability and lunar rendezvous operations.','Returned lunar samples and extensive scientific observations.'],outcome:'Successfully landed humans on the Moon and safely returned them to Earth.'},{name:'Voyager 1',rocket:'🛰️',bullets:['Launched in 1977 to explore outer planets.','Captured detailed data from Jupiter and Saturn.','Carries the Golden Record representing humanity.'],outcome:'Entered interstellar space and remains the most distant human-made object.'},{name:'Hubble',rocket:'🔭',bullets:['Launched in 1990 into low Earth orbit.','Observed distant galaxies and nebulae.','Multiple servicing missions extended lifespan.'],outcome:'Transformed astronomy with groundbreaking discoveries.'},{name:'Perseverance',rocket:'🚁',bullets:['Landed on Mars in Jezero Crater.','Collects rock samples for future return.','Searches for signs of ancient microbial life.'],outcome:'Advancing understanding of Mars habitability.'},{name:'Artemis I',rocket:'🌙',bullets:['Uncrewed test of Space Launch System.','Sent Orion spacecraft around the Moon.','Validated systems for future crews.'],outcome:'Successfully paved the way for Artemis II.'},{name:'Mars Pathfinder',rocket:'🚀',bullets:['Delivered Sojourner rover to Mars.','Demonstrated affordable entry and landing technology.','Returned atmospheric and surface data.'],outcome:'Proved rover mobility on another planet.'}];const grid=document.getElementById('grid');missions.forEach(m=>{let d=document.createElement('div');d.className='item';d.textContent=m.rocket;grid.appendChild(d)});let active=null;function swipe(){let c=document.getElementById('card');c.classList.remove('animate');void c.offsetWidth;c.classList.add('animate');let i=Math.floor(Math.random()*missions.length);document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.item')[i].classList.add('selected');active=missions[i];document.getElementById('screen').innerHTML='Dispensed Mission: '+active.name;let b=document.getElementById('missionBtn');b.style.display='block';b.textContent=active.name;b.onclick=()=>showMission(active);}function showMission(m){document.getElementById('info').innerHTML='<h2>'+m.name+'</h2><h3>Mission History</h3><ul>'+m.bullets.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>Outcome</h3><p>'+m.outcome+'</p>';document.getElementById('modal').style.display='flex';}function closeM(){modal.style.display='none';}</script></body></html>
