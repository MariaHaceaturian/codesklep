  :root{
    --bg:#f5f5f7; --panel:#ffffff; --line:#e2e2e6; --text:#1d1d1f; --muted:#86868b;
    --accent:#0071e3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
  }
  header{ padding:18px 28px; font-size:17px; font-weight:600; border-bottom:1px solid var(--line); background:var(--panel);}
  .layout{ flex:1; display:flex; overflow:hidden; }

  .sidebar{ width:190px; padding:22px 14px; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; }
  .sidebar h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px 6px; font-weight:600;}
  .filter-btn{
    display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px;
    border:none; border-radius:11px; background:var(--bg); color:var(--text);
    font-size:14px; font-weight:500; cursor:pointer; transition:background .15s;
  }
  .filter-btn:hover{ background:#eceef0; }
  .filter-btn.active{ background:var(--accent); color:#fff; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; overflow:auto; }
  .canvas-wrap{ background:var(--panel); border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  canvas{ display:block; max-height:62vh; width:auto; border-radius:6px; background:#fff; }
  .controls{ margin-top:18px; display:flex; align-items:center; gap:10px; }
  .btn{
    padding:12px 26px; border-radius:980px; border:none; font-size:14px; font-weight:600;
    cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{ opacity:.85; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--panel); color:var(--accent); border:1px solid var(--accent); }

  .options{ width:260px; padding:22px 18px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; }
  .options h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 14px; font-weight:600;}
  .options .empty{ color:var(--muted); font-size:13px; margin-top:40px; text-align:center; }

  .swatch-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .swatch{
    width:30px; height:30px; border-radius:9px; cursor:pointer; border:2px solid transparent; flex-shrink:0;
  }
  .swatch.selected{ border-color:var(--accent); }
  .swatch-name{ font-size:13px; flex:1; }
  .slider{ width:100%; }
  .swatch-slider{ width:100%; margin-top:4px; }

  .type-option{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .type-option input{ width:18px; height:18px; }

  label.field-label{ font-size:13px; color:var(--muted); display:block; margin:14px 0 6px; }
  input[type="range"]{ width:100%; }
  input[type="text"]{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; font-family:inherit;
  }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .switch{ position:relative; width:44px; height:26px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-track{
    position:absolute; cursor:pointer; inset:0; background:#d1d1d6; border-radius:999px; transition:.2s;
  }
  .slider-track:before{
    content:""; position:absolute; width:22px; height:22px; left:2px; top:2px; background:#fff;
    border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .slider-track{ background:var(--accent); }
  .switch input:checked + .slider-track:before{ transform:translateX(18px); }
  .value-badge{ font-size:12px; color:var(--muted); float:right; }
</style>
</head>
<body>

<header>Poster Generator — Das Schweizer Plakat style</header>

<div class="layout">
  <div class="sidebar">
    <h3>Filter</h3>
    <button class="filter-btn" data-filter="color">Color</button>
    <button class="filter-btn" data-filter="type">Type</button>
    <button class="filter-btn" data-filter="texture">Texture</button>
    <button class="filter-btn" data-filter="border">Border</button>
    <button class="filter-btn" data-filter="text">Text</button>
    <button class="filter-btn" data-filter="upload">Upload</button>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="art" width="900" height="1273"></canvas>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="generateBtn">Generate</button>
      <button class="btn btn-secondary" id="downloadBtn">Download PDF</button>
    </div>
  </div>

  <div class="options" id="options">
    <div class="empty">Select a filter to see its options.</div>
  </div>
</div>

<script>
const PALETTE = [
  {key:'red',    name:'Red / Orange', hex:'#E5482E', base:true},
  {key:'yellow', name:'Golden Yellow', hex:'#F2B705', base:true},
  {key:'olive',  name:'Mustard / Olive', hex:'#9B8B1F'},
  {key:'green',  name:'Green', hex:'#6E8B3D'},
  {key:'blue',   name:'Blue', hex:'#3A6EA5'},
  {key:'black',  name:'Black', hex:'#000000', base:true},
  {key:'cream',  name:'Cream', hex:'#F3EAD8', base:true},
];

const FONTS = [
  {key:'archivo', label:'Archivo',             family:'"Archivo"',        weightH1:'700', weightCap:'500'},
  {key:'inter',   label:'Inter',                family:'"Inter"',          weightH1:'700', weightCap:'500'},
  {key:'bodoni',  label:'Bodoni Moda Italic',   family:'"BodoniModaItalic"', weightH1:'600', weightCap:'500'},
];
const TEXTURES = [
  {key:'dots',       label:'Dot Screen / Polka Dot Grid'},
  {key:'screentone', label:'Screen Tone / Manga Tone'},
  {key:'lines',      label:'Line Screen / Engraving Lines'},
];
const BORDER_PATTERNS = [
  {key:'uniform',    label:'Uniform'},
  {key:'asymmetric', label:'Asymmetric'},
  {key:'circles',    label:'Circles'},
  {key:'triangles',  label:'Triangles'},
];

const state = {
  colors: {},            // key -> {selected, lightness}
  font: 'archivo',
  textureType: 'dots',
  dotSize: 4,
  borderOn: true,
  borderSize: 40,
  borderColor: 'cream',
  borderPattern: 'uniform',
  text: 'Das Schweizer Plakat',
  textOpacity: 100,
  textSizePct: 100,
  uploadedImg: null,
};
PALETTE.forEach(c => state.colors[c.key] = {selected: !!c.base, lightness: 0});

function adjustLightness(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.min(255,Math.max(0,r+amt*2.3));
  g=Math.min(255,Math.max(0,g+amt*2.3));
  b=Math.min(255,Math.max(0,b+amt*2.3));
  return `rgb(${r|0},${g|0},${b|0})`;
}
function activeColors(){
  return PALETTE.filter(c=>state.colors[c.key].selected)
    .map(c=>adjustLightness(c.hex, state.colors[c.key].lightness));
}

/* ---------- Sidebar filter switching ---------- */
const optionsEl = document.getElementById('options');
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderOptions(btn.dataset.filter);
  });
});

function renderOptions(filter){
  if(filter==='color') return renderColorPanel();
  if(filter==='type') return renderTypePanel();
  if(filter==='texture') return renderTexturePanel();
  if(filter==='border') return renderBorderPanel();
  if(filter==='text') return renderTextPanel();
  if(filter==='upload') return renderUploadPanel();
}

function renderColorPanel(){
  optionsEl.innerHTML = '<h3>Color</h3>';
  PALETTE.forEach(c=>{
    const row = document.createElement('div'); row.className='swatch-row';
    const sw = document.createElement('div'); sw.className='swatch'+(state.colors[c.key].selected?' selected':'');
    sw.style.background = c.hex;
    sw.onclick = ()=>{ state.colors[c.key].selected = !state.colors[c.key].selected; renderColorPanel(); };
    const wrap = document.createElement('div'); wrap.style.flex='1';
    const name = document.createElement('div'); name.className='swatch-name'; name.textContent=c.name;
    const slider = document.createElement('input'); slider.type='range'; slider.min=-40; slider.max=40;
    slider.value = state.colors[c.key].lightness; slider.className='swatch-slider';
    slider.oninput = e=>{ state.colors[c.key].lightness = +e.target.value; };
    wrap.appendChild(name); wrap.appendChild(slider);
    row.appendChild(sw); row.appendChild(wrap);
    optionsEl.appendChild(row);
  });
}

function renderTypePanel(){
  optionsEl.innerHTML = '<h3>Type</h3><label class="field-label">Choose one typeface for the whole poster.</label>';
  FONTS.forEach(f=>{
    const row = document.createElement('label'); row.className='type-option';
    const rb = document.createElement('input'); rb.type='radio'; rb.name='fontChoice'; rb.checked = state.font===f.key;
    rb.onchange = ()=>{ state.font = f.key; };
    row.appendChild(rb);
    row.appendChild(document.createTextNode(f.label));
    optionsEl.appendChild(row);
  });
}

function renderTexturePanel(){
  optionsEl.innerHTML = '<h3>Texture</h3>';
  TEXTURES.forEach(t=>{
    const row = document.createElement('label'); row.className='type-option';
    const rb = document.createElement('input'); rb.type='radio'; rb.name='textureChoice'; rb.checked = state.textureType===t.key;
    rb.onchange = ()=>{ state.textureType = t.key; };
    row.appendChild(rb);
    row.appendChild(document.createTextNode(t.label));
    optionsEl.appendChild(row);
  });
  const sizeLabel = document.createElement('label'); sizeLabel.className='field-label';
  sizeLabel.innerHTML = 'Texture size<span class="value-badge" id="dotVal"></span>';
  optionsEl.appendChild(sizeLabel);
  const slider = document.createElement('input');
  slider.type='range'; slider.min=1; slider.max=10; slider.value=state.dotSize;
  slider.oninput = e=>{ state.dotSize = +e.target.value; document.getElementById('dotVal').textContent=state.dotSize; };
  optionsEl.appendChild(slider);
  document.getElementById('dotVal').textContent = state.dotSize;
}

function renderBorderPanel(){
  optionsEl.innerHTML = '<h3>Border</h3>';
  const toggleRow = document.createElement('div'); toggleRow.className='toggle-row';
  toggleRow.innerHTML = `<span>Show border</span>`;
  const sw = document.createElement('label'); sw.className='switch';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=state.borderOn;
  const track = document.createElement('span'); track.className='slider-track';
  cb.onchange = e=>{ state.borderOn = e.target.checked; rest.style.display = state.borderOn?'block':'none'; };
  sw.appendChild(cb); sw.appendChild(track); toggleRow.appendChild(sw);
  optionsEl.appendChild(toggleRow);

  const rest = document.createElement('div');
  rest.style.display = state.borderOn?'block':'none';

  const colorLabel = document.createElement('label'); colorLabel.className='field-label';
  colorLabel.textContent = 'Border color (from active colors)';
  rest.appendChild(colorLabel);
  const colorRow = document.createElement('div');
  colorRow.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;';
  const activeList = PALETTE.filter(c=>state.colors[c.key].selected);
  if(!activeList.find(c=>c.key===state.borderColor)) state.borderColor = activeList[0] ? activeList[0].key : 'cream';
  activeList.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'swatch'+(state.borderColor===c.key?' selected':'');
    chip.style.background = adjustLightness(c.hex, state.colors[c.key].lightness);
    chip.title = c.name;
    chip.onclick = ()=>{ state.borderColor = c.key; renderBorderPanel(); };
    colorRow.appendChild(chip);
  });
  rest.appendChild(colorRow);

  const patLabel = document.createElement('label'); patLabel.className='field-label';
  patLabel.textContent = 'Border style';
  rest.appendChild(patLabel);
  BORDER_PATTERNS.forEach(p=>{
    const row = document.createElement('label'); row.className='type-option';
    const rb = document.createElement('input'); rb.type='radio'; rb.name='borderPattern'; rb.checked = state.borderPattern===p.key;
    rb.onchange = ()=>{ state.borderPattern = p.key; };
    row.appendChild(rb);
    row.appendChild(document.createTextNode(p.label));
    rest.appendChild(row);
  });

  const sizeRow = document.createElement('div');
  sizeRow.innerHTML = `<label class="field-label">Border size<span class="value-badge" id="borderVal"></span></label>`;
  const slider = document.createElement('input'); slider.type='range'; slider.min=10; slider.max=90; slider.value=state.borderSize;
  slider.oninput = e=>{ state.borderSize = +e.target.value; document.getElementById('borderVal').textContent=state.borderSize+'px'; };
  sizeRow.appendChild(slider);
  rest.appendChild(sizeRow);

  optionsEl.appendChild(rest);
  document.getElementById('borderVal').textContent = state.borderSize+'px';
}

function renderTextPanel(){
  optionsEl.innerHTML = '<h3>Text</h3><label class="field-label">Poster text</label>';
  const input = document.createElement('input'); input.type='text'; input.value=state.text;
  input.oninput = e=>{ state.text = e.target.value; };
  optionsEl.appendChild(input);

  const opLabel = document.createElement('label'); opLabel.className='field-label';
  opLabel.innerHTML = 'Text opacity<span class="value-badge" id="textOpVal"></span>';
  optionsEl.appendChild(opLabel);
  const opSlider = document.createElement('input'); opSlider.type='range'; opSlider.min=20; opSlider.max=100; opSlider.value=state.textOpacity;
  opSlider.oninput = e=>{ state.textOpacity = +e.target.value; document.getElementById('textOpVal').textContent=state.textOpacity+'%'; };
  optionsEl.appendChild(opSlider);
  document.getElementById('textOpVal').textContent = state.textOpacity+'%';

  const szLabel = document.createElement('label'); szLabel.className='field-label';
  szLabel.innerHTML = 'Text size<span class="value-badge" id="textSzVal"></span>';
  optionsEl.appendChild(szLabel);
  const szSlider = document.createElement('input'); szSlider.type='range'; szSlider.min=50; szSlider.max=150; szSlider.value=state.textSizePct;
  szSlider.oninput = e=>{ state.textSizePct = +e.target.value; document.getElementById('textSzVal').textContent=state.textSizePct+'%'; };
  optionsEl.appendChild(szSlider);
  document.getElementById('textSzVal').textContent = state.textSizePct+'%';
}

function renderUploadPanel(){
  optionsEl.innerHTML = '<h3>Upload</h3><label class="field-label">Replace the illustration with your own photo, rendered in halftone using the colors selected above.</label>';

  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.style.cssText = 'width:100%;font-size:13px;margin-top:6px;';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{ state.uploadedImg = img; renderUploadPanel(); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  optionsEl.appendChild(input);

  if(state.uploadedImg){
    const preview = document.createElement('img');
    preview.src = state.uploadedImg.src;
    preview.style.cssText = 'width:100%;border-radius:10px;margin-top:14px;display:block;';
    optionsEl.appendChild(preview);

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove image';
    removeBtn.className = 'btn btn-secondary';
    removeBtn.style.cssText = 'margin-top:12px;width:100%;';
    removeBtn.onclick = ()=>{ state.uploadedImg = null; renderUploadPanel(); };
    optionsEl.appendChild(removeBtn);
  }
}

/* ---------- Shared texture cell painter: dots / screentone / lines ---------- */
function paintCell(x, y, size, colorHex, lum, textureType){
  ctx.fillStyle = colorHex;
  if(textureType==='lines'){
    const h = size*(0.35+(1-lum)*1.1);
    ctx.fillRect(x-size*1.1, y-h/2, size*2.2, h);
  } else if(textureType==='screentone'){
    const r = size*(0.18+(1-lum)*0.55);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  } else {
    ctx.globalAlpha = 0.25+(1-lum)*0.5;
    const r = size*(0.2+(1-lum)*0.7);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------- Halftone from uploaded image ---------- */
function nearestColor(r,g,b, palette){
  let best = palette[0], bestDist = Infinity;
  for(const c of palette){
    let pr,pg,pb;
    if(c.startsWith('#')){ const n=parseInt(c.slice(1),16); pr=(n>>16)&255; pg=(n>>8)&255; pb=n&255; }
    else { const m=c.match(/[\d.]+/g); pr=+m[0]; pg=+m[1]; pb=+m[2]; }
    const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
    if(d < bestDist){ bestDist = d; best = c; }
  }
  return best;
}

function drawImageHalftone(ix, iy, iw, ihArea, cols, size, textureType){
  const off = document.createElement('canvas');
  off.width = Math.round(iw); off.height = Math.round(ihArea);
  const octx = off.getContext('2d');
  const img = state.uploadedImg;
  const scale = Math.max(off.width/img.width, off.height/img.height);
  const dw = img.width*scale, dh = img.height*scale;
  octx.drawImage(img, (off.width-dw)/2, (off.height-dh)/2, dw, dh);
  const data = octx.getImageData(0,0,off.width,off.height).data;

  ctx.fillStyle = cols[cols.length-1] || '#F3EAD8';
  ctx.fillRect(ix, iy, iw, ihArea);

  for(let y=0; y<ihArea; y+=size*2.2){
    for(let x=0; x<iw; x+=size*2.2){
      const px = Math.min(off.width-1, Math.max(0, Math.round(x)));
      const py = Math.min(off.height-1, Math.max(0, Math.round(y)));
      const idx = (py*off.width+px)*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const lum = (r*0.299+g*0.587+b*0.114)/255;
      const color = nearestColor(r,g,b,cols);
      let px2 = ix+x, py2 = iy+y;
      if(textureType==='dots'){ px2 += (rand(x+y)-.5)*size; py2 += (rand(y-x)-.5)*size; }
      paintCell(px2, py2, size, color, lum, textureType);
    }
  }
}

/* ---------- Art generation ---------- */
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');

let seed = Math.random()*1000;
function rand(n){ let x = Math.sin(n*12.9898 + seed*78.233)*43758.5453; return x-Math.floor(x); }

function computeInsets(b, pattern){
  if(pattern==='asymmetric'){
    return {
      top:    b*(0.5+rand(301)*0.6),
      right:  b*(0.9+rand(302)*0.8),
      bottom: b*(0.6+rand(303)*0.7),
      left:   b*(0.5+rand(304)*0.6),
    };
  }
  return {top:b, right:b, bottom:b, left:b};
}

function drawArt(){
  seed = Math.random()*1000;
  const W = canvas.width, H = canvas.height;
  const cols = activeColors();
  const warm = cols[0] || '#E5482E';
  const sec  = cols[1] || '#F2B705';
  const cream = state.colors.cream.selected ? adjustLightness('#F3EAD8', state.colors.cream.lightness) : '#F3EAD8';
  const black = state.colors.black.selected ? adjustLightness('#000000', state.colors.black.lightness) : '#000000';
  const borderColorHex = (state.colors[state.borderColor] && state.colors[state.borderColor].selected)
    ? adjustLightness(PALETTE.find(p=>p.key===state.borderColor).hex, state.colors[state.borderColor].lightness)
    : cream;
  const b = state.borderOn ? state.borderSize : 0;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = state.borderOn ? borderColorHex : cream;
  ctx.fillRect(0,0,W,H);

  const insets = state.borderOn ? computeInsets(b, state.borderPattern) : {top:0,right:0,bottom:0,left:0};
  const ix=insets.left, iy=insets.top, iw=W-insets.left-insets.right, ih=H-insets.top-insets.bottom;

  const dot = state.dotSize;
  const texType = state.textureType;

  if(state.uploadedImg){
    // uploaded photo, rendered in the chosen texture using the active palette
    drawImageHalftone(ix, iy, iw, ih*0.8, cols, dot, texType);
  } else {
    // illustration gradient background
    const grad = ctx.createLinearGradient(0,iy,0,iy+ih);
    grad.addColorStop(0, warm);
    grad.addColorStop(.55, sec);
    grad.addColorStop(1, cols[2] || '#9B8B1F');
    ctx.fillStyle = grad;
    ctx.fillRect(ix,iy,iw,ih*0.8);

    // halftone texture
    for(let y=iy; y<iy+ih*0.8; y+=dot*2.2){
      for(let x=ix; x<ix+iw; x+=dot*2.2){
        const n = rand(x*0.013+y*0.027);
        const colorHex = cols[Math.floor(n*cols.length)] || warm;
        let px = x, py = y;
        if(texType==='dots'){ px += (rand(x+y)-.5)*dot; py += (rand(y-x)-.5)*dot; }
        paintCell(px, py, dot, colorHex, 1-n, texType);
      }
    }

    // mountain silhouette — random number of peaks, heights and positions each time
    const peakCount = 3 + Math.floor(rand(1)*3); // 3-5 peaks
    const baseY = iy+ih*(0.4+rand(2)*0.12);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.moveTo(ix+iw*0.1, baseY);
    for(let p=0; p<=peakCount; p++){
      const px = ix+iw*(0.1 + (0.8/peakCount)*p + (rand(10+p)-.5)*0.05);
      const py = baseY - ih*(0.1+rand(20+p)*0.35);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(ix+iw*0.9, baseY);
    ctx.lineTo(ix+iw*0.1, baseY);
    ctx.closePath(); ctx.fill();

    // clouds — soft blob clusters, randomized count/size/position
    const cloudCount = 3 + Math.floor(rand(30)*3);
    for(let c=0;c<cloudCount;c++){
      const ccx = ix+iw*rand(40+c*3);
      const ccy = iy+ih*(0.3+rand(41+c*3)*0.45);
      const cr = iw*(0.05+rand(42+c*3)*0.09);
      ctx.fillStyle = `rgba(243,234,216,${0.35+rand(43+c)*0.35})`;
      for(let k=0;k<4;k++){
        ctx.beginPath();
        ctx.arc(ccx+(rand(44+c*5+k)-.5)*cr*1.6, ccy+(rand(45+c*5+k)-.5)*cr*0.8, cr*(0.5+rand(46+c*5+k)*0.6), 0, Math.PI*2);
        ctx.fill();
      }
    }

    // sun / planet — placed anywhere in the illustration each generation
    const sunX = ix+iw*(0.08+rand(60)*0.84);
    const sunY = iy+ih*(0.08+rand(61)*0.55);
    const sunR = iw*(0.055+rand(62)*0.06);
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI*2);
    ctx.strokeStyle = sec; ctx.lineWidth = iw*0.012; ctx.stroke();
    ctx.fillStyle = cols[2] || '#9B8B1F'; ctx.fill();

    // crescent moon — placed near the sun, offset randomly
    const moonX = sunX - sunR*(1.6+rand(63)*1.2);
    const moonY = sunY + sunR*(rand(64)-.5)*1.5;
    ctx.fillStyle = cols[3] || '#6E8B3D';
    ctx.beginPath(); ctx.arc(moonX, moonY, sunR*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = cream;
    ctx.beginPath(); ctx.arc(moonX+sunR*0.1, moonY-sunR*0.05, sunR*0.34, 0, Math.PI*2); ctx.fill();
  }

  // small cross
  ctx.fillStyle = warm;
  const cx=ix+iw*(0.15+rand(70)*0.75), cy=iy+ih*(0.15+rand(71)*0.5), cs=iw*0.03;
  ctx.fillRect(cx-cs/4, cy-cs, cs/2, cs*2);
  ctx.fillRect(cx-cs, cy-cs/4, cs*2, cs/2);

  // scattered black marks
  for(let i=0;i<22;i++){
    const n = rand(i*3.7);
    const mx = ix+iw*rand(i*1.3), my = iy+ih*0.75*rand(i*2.1);
    ctx.strokeStyle = black; ctx.lineWidth=1.5;
    ctx.beginPath();
    if(n>0.66){
      ctx.moveTo(mx,my); ctx.lineTo(mx+8*(n-.5)*14, my-10); ctx.lineTo(mx+6, my+6); ctx.closePath(); ctx.stroke();
    } else {
      ctx.moveTo(mx,my); ctx.lineTo(mx+(n-.5)*40, my+(n-.3)*18); ctx.stroke();
    }
  }

  // torn corner (top-left)
  if(b>0){
    ctx.fillStyle = borderColorHex;
    ctx.beginPath();
    ctx.moveTo(ix, iy);
    ctx.lineTo(ix+iw*0.22, iy);
    ctx.lineTo(ix+iw*0.14, iy+ih*0.05);
    ctx.lineTo(ix+iw*0.2, iy+ih*0.08);
    ctx.lineTo(ix+iw*0.05, iy+ih*0.16);
    ctx.lineTo(ix, iy+ih*0.1);
    ctx.closePath(); ctx.fill();
  }

  // right bleed checkerboard stripe
  if(b>0){
    const stripeW = Math.min(b*0.8, insets.right*0.9), sq = b*0.3;
    for(let y=0; y<H; y+=sq){
      ctx.fillStyle = (Math.floor(y/sq)%2===0) ? warm : '#ffffff';
      ctx.fillRect(W-stripeW, y, stripeW, sq);
    }
  }

  // border pattern trims: circles or triangles along the top/bottom bands
  if(state.borderOn && (state.borderPattern==='circles' || state.borderPattern==='triangles')){
    const n = Math.max(6, Math.floor(iw/(b*1.3)));
    for(let i=0;i<n;i++){
      const tx = insets.left + (iw/n)*(i+0.5);
      if(state.borderPattern==='circles'){
        ctx.fillStyle = black;
        ctx.beginPath(); ctx.arc(tx, insets.top/2, b*0.16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(tx, H-insets.bottom/2, b*0.16, 0, Math.PI*2); ctx.fill();
      } else {
        const tw = iw/n;
        ctx.fillStyle = black;
        ctx.beginPath();
        ctx.moveTo(tx-tw*0.3, insets.top);
        ctx.lineTo(tx, insets.top-insets.top*0.45);
        ctx.lineTo(tx+tw*0.3, insets.top);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(tx-tw*0.3, H-insets.bottom);
        ctx.lineTo(tx, H-insets.bottom+insets.bottom*0.45);
        ctx.lineTo(tx+tw*0.3, H-insets.bottom);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  drawText(ix, iy, iw, ih, borderColorHex, black);
}

function drawText(ix, iy, iw, ih, cream, black){
  const textY = iy + ih*0.86;
  const fontDef = FONTS.find(f=>f.key===state.font) || FONTS[0];
  const fontFamily = fontDef.family;
  const words = state.text.trim().split(/\s+/);
  const sizeH1 = iw*0.11*(state.textSizePct/100);
  const textAlpha = state.textOpacity/100;

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = black;
  ctx.font = `${fontDef.weightH1} ${sizeH1}px ${fontFamily}`;
  ctx.globalAlpha = textAlpha;

  let lines;
  if(words.length <= 1){ lines = [words[0]||'Art']; }
  else if(words.length === 2){ lines = [words[0], words[1]]; }
  else { lines = [words.slice(0,-1).join(' '), words[words.length-1]]; }

  let ly = textY;
  const lh = sizeH1*0.95;
  lines.forEach((line,i)=>{
    const lx = i===lines.length-1 && lines.length>1 ? ix+iw*0.5 : ix+iw*0.04;
    ctx.fillText(line, lx, ly);
    // knockout shapes cut into letters
    const metrics = ctx.measureText(line);
    for(let k=0;k<3;k++){
      const px = lx + metrics.width*rand(i*7+k*2.3);
      const py = ly - sizeH1*0.35*rand(i*3+k);
      ctx.fillStyle = cream;
      const shape = Math.floor(rand(i+k*9)*3);
      if(shape===0){ ctx.beginPath(); ctx.arc(px,py,sizeH1*0.045,0,Math.PI*2); ctx.fill(); }
      else if(shape===1){ ctx.fillRect(px,py-sizeH1*0.03,sizeH1*0.07,sizeH1*0.06); }
      else { ctx.fillRect(px-sizeH1*0.015,py-sizeH1*0.04,sizeH1*0.03,sizeH1*0.08); ctx.fillRect(px-sizeH1*0.04,py-sizeH1*0.015,sizeH1*0.08,sizeH1*0.03); }
      ctx.fillStyle = black;
    }
    ly += lh;
  });
  ctx.globalAlpha = 1;

  // reduced-opacity caption, same typeface
  ctx.font = `${fontDef.weightCap} ${iw*0.018}px ${fontFamily}`;
  ctx.globalAlpha = 0.6;
  ctx.textAlign = 'right';
  ctx.fillText('Generated poster · Weingart style system', ix+iw*0.98, iy+ih*0.97);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

document.getElementById('generateBtn').addEventListener('click', drawArt);
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: 'portrait',
    unit: 'px',
    format: [canvas.width, canvas.height],
    hotfixes: ['px_scaling']
  });
  doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
  doc.save('poster.pdf');
});

document.querySelector('[data-filter="color"]').click();
drawArt();
</script>
</body>
