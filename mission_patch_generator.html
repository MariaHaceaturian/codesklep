<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Patch Generator — Baruch × NASA</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --line:#e2e2e6; --text:#1d1d1f; --muted:#86868b;
    --accent:#0071e3; --live:#1a9d4a; --warn:#c77700; --hover:#eceef0; --track:#d1d1d6; --ht:0,0,0; --ht-op:.05;
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0d; --panel:#1c1c1e; --line:#2c2c2e; --text:#f5f5f7; --muted:#98989d; --hover:#2c2c2e; --track:#48484a;
    --accent:#0a84ff; --live:#30d158; --warn:#ff9f0a; --ht:255,255,255; --ht-op:.045;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; font-weight:450;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; transition:background .25s,color .25s;
  }
  button,input,select{ font-family:inherit; }
  header{ padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header .title{ font-size:17px; font-weight:600; }
  header .sub{ font-size:12px; color:var(--muted); }
  .layout{ flex:1; display:flex; overflow:hidden; min-height:0; }

  .sidebar{ width:190px; padding:22px 14px 84px; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; flex-shrink:0; }
  .sidebar h3, .options h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px 6px; font-weight:600;}
  .options h3{ margin-left:0; margin-bottom:14px; }
  .filter-btn{
    display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px;
    border:none; border-radius:11px; background:var(--bg); color:var(--text);
    font-size:14px; font-weight:600; cursor:pointer; transition:background .15s;
  }
  .filter-btn:hover{ background:var(--hover); }
  .filter-btn.active{ background:var(--accent); color:#fff; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:18px; overflow:auto; min-width:0; gap:0; }
  .stage > :first-child{ margin-top:auto; }
  .stage > :last-child{ margin-bottom:auto; }
  .seg{ display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:980px; padding:3px; margin-bottom:12px; }
  .seg button{ border:none; background:none; color:var(--muted); font-size:12px; font-weight:600; padding:6px 14px; border-radius:980px; cursor:pointer; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .canvas-wrap{ background:var(--panel); border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #patch{ width:min(50vh, 76vw, 520px); aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#fff; }
  #patch.dark{ background:#242426; }
  #patch.checker{ background:#fff conic-gradient(#e6e6ea 25%, #fff 0 50%, #e6e6ea 0 75%, #fff 0) 0 0/24px 24px; }
  #patch svg{ display:block; width:100%; height:100%; }
  .canvas-wrap{ position:relative; }
  #patch{ touch-action:none; }
  #dragTag{ position:absolute; left:0; top:0; transform:translate(-50%,-140%); pointer-events:none; background:var(--text); color:var(--panel); font-size:11px; font-weight:600; padding:4px 9px; border-radius:980px; white-space:nowrap; opacity:0; transition:opacity .12s; }
  #dragTag.on{ opacity:.92; }
  .drag-hint{ margin-top:10px; font-size:12px; color:var(--muted); text-align:center; }
  #lockBtn.locked{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .controls{ margin-top:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn{ padding:12px 22px; border-radius:980px; border:none; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s; }
  .btn:hover{ opacity:.85; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--panel); color:var(--accent); border:1px solid var(--accent); }
  .scale-row{ margin-top:12px; display:flex; align-items:flex-end; gap:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 16px; }
  .scale-row .cap{ font-size:11px; color:var(--muted); text-align:center; margin-top:4px; }
  .scale-row canvas{ display:block; }
  .scale-row .lbl{ font-size:12px; font-weight:600; max-width:120px; line-height:1.35; }
  .status{ margin-top:10px; font-size:12px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:980px; padding:7px 14px; max-width:100%; text-align:center; }
  .status.warn{ color:var(--warn); }

  .options{ width:290px; padding:22px 18px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; flex-shrink:0; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.45; margin:6px 0 12px; }
  label.field-label{ font-size:13px; color:var(--muted); display:block; margin:14px 0 6px; }
  .value-badge{ font-size:12px; color:var(--muted); float:right; }
  input[type="range"]{ width:100%; }
  input[type="text"]{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-weight:inherit; background:var(--panel); color:var(--text); }
  .type-option{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  .type-option input{ width:18px; height:18px; margin-top:1px; flex-shrink:0; }
  .type-option small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; line-height:1.35; }
  .role{ margin-bottom:16px; }
  .role .rname{ font-size:13px; margin-bottom:6px; display:flex; justify-content:space-between; }
  .chips{ display:flex; gap:5px; flex-wrap:nowrap; }
  .chip{ width:22px; height:22px; border-radius:7px; cursor:pointer; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(128,128,128,.35); }
  .chip.selected{ border-color:var(--accent); }
  .swatch-slider{ width:100%; margin-top:6px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .switch{ position:relative; width:44px; height:26px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-track{ position:absolute; cursor:pointer; inset:0; background:var(--track); border-radius:999px; transition:.2s; }
  .slider-track:before{ content:""; position:absolute; width:22px; height:22px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider-track{ background:var(--accent); }
  .switch input:checked + .slider-track:before{ transform:translateX(18px); }
  .opt-btn{ width:100%; margin-top:8px; }
  .btn-col{ display:flex; flex-direction:column; }
  .symcard{ border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:10px 0; }
  .symcard img{ width:56px; height:56px; object-fit:contain; background:#fff; border-radius:8px; border:1px solid var(--line); display:block; margin-bottom:6px; }

  /* barely-visible halftone, as on the poster generator site */
  .halftone{ position:fixed; inset:0; z-index:40; pointer-events:none; }
  .halftone::before, .halftone::after{ content:""; position:absolute; inset:0; opacity:var(--ht-op); }
  .halftone::before{ background-image:radial-gradient(circle, rgba(var(--ht),1) 0 1.1px, transparent 1.5px); background-size:7px 7px;
    -webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 62%); mask-image:linear-gradient(160deg,#000 0%,transparent 62%); }
  .halftone::after{ background-image:radial-gradient(circle, rgba(var(--ht),1) 0 1.9px, transparent 2.3px); background-size:13px 13px; background-position:6px 6px;
    -webkit-mask-image:linear-gradient(340deg,#000 0%,transparent 55%); mask-image:linear-gradient(340deg,#000 0%,transparent 55%); }
  #themeBtn{ position:fixed; left:18px; bottom:18px; z-index:60; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #themeBtn svg{ width:20px; height:20px; display:none; }
  :root:not([data-theme="dark"]) #themeBtn .i-sun{ display:block; }
  :root[data-theme="dark"] #themeBtn .i-moon{ display:block; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="halftone" aria-hidden="true"></div>
<button id="themeBtn" aria-label="Switch between light and dark mode" title="Light / dark">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 14.6A8.4 8.4 0 0 1 9.4 3.7a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21 15.4a.6.6 0 0 0-.7-.8z"/></svg>
</button>

<header>
  <span class="title">Mission Patch Generator</span>
  <span class="sub">Baruch × NASA · 3.5″ × 3.5″ · built from the poster generator</span>
</header>

<div class="layout">
  <div class="sidebar">
    <h3>Filter</h3>
    <button class="filter-btn" data-filter="color">Color</button>
    <button class="filter-btn" data-filter="layout">Layout</button>
    <button class="filter-btn" data-filter="letters">Letters</button>
    <button class="filter-btn" data-filter="stars">Stars</button>
    <button class="filter-btn" data-filter="texture">Texture</button>
    <button class="filter-btn" data-filter="border">Border</button>
    <button class="filter-btn" data-filter="text">Text</button>
    <button class="filter-btn" data-filter="symbols">Symbols</button>
    <button class="filter-btn" data-filter="animate">Animate</button>
    <button class="filter-btn" data-filter="lock" id="lockFilter">Lock &amp; tweak</button>
  </div>

  <div class="stage">
    <div class="seg" id="backdropSeg">
      <button data-b="light" class="on">Light</button><button data-b="dark">Dark</button><button data-b="checker">Transparent</button>
    </div>
    <div class="canvas-wrap"><div id="patch"></div><div id="dragTag"></div></div>
    <div class="drag-hint">Drag the B, N, A, oval or star to move them · scroll to resize · Shift-drag the oval to rotate</div>
    <div class="controls">
      <button class="btn btn-primary" id="generateBtn">Generate</button>
      <button class="btn btn-secondary" id="lockBtn">Lock design</button>
      <button class="btn btn-secondary" id="pngBtn">Download PNG</button>
      <button class="btn btn-secondary" id="svgBtn">Download SVG</button>
    </div>
    <div class="scale-row" id="scaleRow">
      <div class="lbl">Scale test<br><span style="font-weight:450;color:var(--muted)">still recognizable?</span></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="options" id="options"></div>
</div>

const state = {

/* ---------- colour ---------- */
function hexOf(k){ return PALETTE.find(p=>p.key===k).hex; }
function adjustLightness(hex, amt){

/* ---------- seeded random ---------- */

/* =========================================================
   GEOMETRY + OCCUPANCY (used to keep stars off the artwork)
========================================================= */
const capCache = {};
function capRatio(fk){
  if(capCache[fk] != null) return capCache[fk];

  const g = document.createElement('canvas').getContext('2d');
  g.font = `${f.w} 1000px ${f.fam}`;
  const m = g.measureText('B');
  const v = (m.actualBoundingBoxAscent||700)/1000;

  return v || 0.7;
}
const bbCache = {};
function glyphBox(fk, ch, w){
  const key = fk+ch+w; if(bbCache[key]) return bbCache[key];
  const f = fontOf(fk);
  const g = document.createElement('canvas').getContext('2d');
  g.font = `${w} 1000px ${f.fam}`;
  const m = g.measureText(ch);
  const v = {l:(m.actualBoundingBoxLeft||0)/1000, w:((m.actualBoundingBoxLeft||0)+(m.actualBoundingBoxRight||700))/1000, h:(m.actualBoundingBoxAscent||700)/1000};
  if(fontsReady) bbCache[key] = v;

}
const advCache = {};
function advRatio(fk, ch){
  const key = fk+ch; if(advCache[key] != null) return advCache[key];
  const f = LETTERS.find(l=>l.key===fk);
  const g = document.createElement('canvas').getContext('2d');
  g.font = `${f.w} 1000px ${f.fam}`;
  const v = g.measureText(ch).width/1000 || 0.7;

}
const oc = document.createElement('canvas').getContext('2d');
function nMatrix(){

  return [s,0,0,s, s*(L.nX-cx)+cx, s*(L.nY-cy)+cy];
}
function fontBBox(bs){
  const gB = glyphBox(state.bFont,'B',weightOf(state.bFont,state.bWeight)), fs = Math.min((BH*bs)/gB.h, (BW*1.2*bs)/gB.w);

}
const Bpath = new Path2D(B_D), Npath = new Path2D(N_D), Apath = new Path2D(A_D);

  // B (+ shadow)
  const bs = L.bScale, offs = L.shadow ? [[0,0],[L.shDx,L.shDy]] : [[0,0]];
  for(const [dx,dy] of offs){

}
let starList = [], starSig = '';
function starLimit(y){
  let lim = R - 62;

}
const REF_FREE = 676;
function freeFraction(){
  let free = 0;

    const x = 30+gx*18.8, y = 30+gy*18.8;
    if(Math.hypot(x-CX,y-CY) > starLimit(y)) continue;
    if(!isOccupied(x,y,19)) free++;

}
window.__free = ()=>freeFraction();
function genStars(){
  const L = state.layout;

  const out = [];
  const target = Math.round(state.density * freeFraction() / REF_FREE);
  let tries = 0;
  while(out.length < target && tries < 60000){
    tries++;
    const x = 30 + rnd()*940, y = 30 + rnd()*940;
    const lim = starLimit(y);
    if(Math.hypot(x-CX,y-CY) > lim) continue;
    const cross = rnd() < state.crossPct/100;
    let r;
    if(cross){ r = [9,12,15][Math.floor(rnd()*3)]*state.dotScale/100; if(emb) r = Math.max(r,10); }
    else { r = [3.5,4.5,6,8][Math.floor(rnd()*4)]*state.dotScale/100; if(emb) r = Math.max(r,5); }
    const pad = r + 14;
    if(isOccupied(x,y,pad)) continue;
    let ok = true;
    for(const s of out){ if(Math.hypot(x-s.x,y-s.y) < r + s.r + 24){ ok=false; break; } }

let dragging = false;
function ensureStars(){

    state.symbols.map(s=>[s.x,s.y,s.w,s.h,s.scale])]);

}

/* =========================================================
   SVG BUILDER
========================================================= */
function star4(cx,cy,r,fill){
  const k=r*0.22;
  const pts=[[0,-r],[k,-k],[r,0],[k,k],[0,r],[-k,k],[-r,0],[-k,-k]];
  const d='M '+pts.map(p=>`${(cx+p[0]).toFixed(1)} ${(cy+p[1]).toFixed(1)}`).join(' L ')+' Z';
  return `<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="3" stroke-linejoin="round"/>`;

function texDefs(){
  const t = state.texture; if(t.type==='none') return '';

  if(t.type==='dots')       return `<pattern id="tex" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><circle cx="${s/2}" cy="${s/2}" r="${s*0.28}" fill="#000" fill-opacity=".24"/></pattern>`;
  if(t.type==='screentone') return `<pattern id="tex" width="${s}" height="${s}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="${s/2}" cy="${s/2}" r="${s*0.17}" fill="#000" fill-opacity=".3"/></pattern>`;
  return `<pattern id="tex" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><rect y="0" width="${s}" height="${s*0.38}" fill="#000" fill-opacity=".22"/></pattern>`;
}
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function buildSvg(o={}){

  const wB = weightOf(state.bFont, state.bWeight), wN = weightOf(state.nFont, state.nWeight);

  }

    if(bd.style==='double'){

      g += `<circle cx="${CX}" cy="${CY}" r="${r1-w*1.6}" fill="none" stroke="${cBd}" stroke-width="${Math.max(3,w*0.4)}"/>`;
    }

    const op = tw ? (0.45 + 0.55*(0.5+0.5*Math.sin(t*2.2 + s.ph))).toFixed(2) : 1;
    const cs = roleCss('stars');
    if(s.cross){

    } else st += `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r.toFixed(1)}" fill="${cs}" opacity="${op}"/>`;

    const base = `font-family='${lfB.fam.replace(/"/g,'')}' font-size="${fs.toFixed(1)}" font-weight="${wB}"`;
    if(L.shadow) bsvg += `<text x="${(x+sdx).toFixed(1)}" y="${(y+sdy).toFixed(1)}" ${base} fill="${cSh}">B</text>`;

const patchEl = document.getElementById('patch');

function render(now){

  patchEl.innerHTML = buildSvg({t: anim ? now/1000*state.animate.speed : null});
  patchEl.className = state.backdrop==='dark' ? 'dark' : state.backdrop==='checker' ? 'checker' : '';

function loop(now){ render(now); requestAnimationFrame(loop); }

function fitB(){
  const L = state.layout;
  // keep the B and its shadow inside the patch edge
  for(let i=0;i<60;i++){
    const x0 = BX0+L.bX+Math.min(0,L.shDx), y1 = BY0+L.bY+BH*L.bScale+Math.max(0,L.shDy);
    const y0 = BY0+L.bY;
    const d = Math.max(Math.hypot(x0-CX,y1-CY), Math.hypot(x0-CX,y0-CY));
    if(d <= 462 || L.bScale<=0.7) break;
    L.bScale = +(L.bScale-0.01).toFixed(2);
  }
}
const THEMES = [
  {b:'blue', shadow:'navy', n:'red',    oval:'white', star:'yellow', stars:'white', bg:'black'},
  {b:'blue', shadow:'navy', n:'yellow', oval:'white', star:'red',    stars:'cream', bg:'black'},
  {b:'white',shadow:'blue', n:'red',    oval:'yellow',star:'yellow', stars:'white', bg:'navy'},
  {b:'red',  shadow:'navy', n:'blue',   oval:'white', star:'yellow', stars:'white', bg:'black'},
  {b:'blue', shadow:'navy', n:'red',    oval:'cream', star:'yellow', stars:'cream', bg:'black'},
];
function lumOf(key){
  const n = parseInt(hexOf(key).slice(1),16), f = c=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
  return 0.2126*f((n>>16)&255)+0.7152*f((n>>8)&255)+0.0722*f(n&255);
}
const contrast = (a,b)=>{ const x=lumOf(a), y=lumOf(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
function randomScheme(){
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const keys = PALETTE.map(p=>p.key);
  const bg = pick(['black','black','black','navy','navy','blue','red','green','cream','white','yellow']);
  const ok = (min, not=[]) => { const c = keys.filter(k=>k!==bg && !not.includes(k) && contrast(k,bg)>=min); return c.length ? pick(c) : (lumOf(bg)>0.4?'black':'white'); };
  const b = ok(2.2);
  const n = ok(2.2,[b]);
  const oval = ok(3,[]);
  const star = ok(3,[oval]);
  const stars = ok(4);
  const dark = lumOf(b) > 0.3;
  return {roles:{bg:{key:bg,l:0}, b:{key:b,l:0}, n:{key:n,l:0}, oval:{key:oval,l:0}, star:{key:star,l:0}, stars:{key:stars,l:0},
    shadow:{key:b, l: dark ? -38 : 30}}, bg};
}
function generate(){
  const g = state.gen, L = state.layout;
  const r = (a,b)=>a+Math.random()*(b-a), ri = (a,b)=>Math.round(r(a,b));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  if(g.stars){
    state.seed = Math.floor(Math.random()*1e9); state.density = ri(60,150);
    state.crossPct = ri(12,55); state.dotScale = ri(80,150);
  }
  if(g.layout){
    L.bScale = +r(0.7,1.05).toFixed(2); L.bX = ri(-30,90); L.bY = ri(-30,70);
    L.ovalTilt = ri(-62,-18); L.ovalA = ri(240,360); L.ovalB = ri(42,86);
    L.ovalX = ri(-50,50); L.ovalY = ri(-50,50);
    L.starScale = +r(0.8,1.5).toFixed(2); L.starX = ri(-40,40); L.starY = ri(-40,40);
    L.nX = ri(-40,40); L.nY = ri(-40,40); L.nScale = +r(0.85,1.2).toFixed(2); L.aX = ri(-40,30); L.aY = ri(-40,40);
    const sh = pick([[-16,14],[16,14],[-14,-12],[18,-10],[-24,22],[0,20],[22,0]]); L.shDx=sh[0]; L.shDy=sh[1]; L.shadow = Math.random()>0.1;

  if(g.colors){
    if(Math.random()<0.3){ const th = pick(THEMES); Object.keys(th).forEach(k=>{ state.roles[k] = {key:th[k], l:0}; }); }
    else { const sc = randomScheme(); Object.keys(sc.roles).forEach(k=>{ state.roles[k] = sc.roles[k]; }); }
    state.roles.border = {key: Math.random()<0.5 ? state.roles.oval.key : state.roles.n.key, l:0};

function retint(sy){
  const max = 700, sc = Math.min(1, max/Math.max(sy.img.naturalWidth, sy.img.naturalHeight));
  const w = Math.round(sy.img.naturalWidth*sc), h = Math.round(sy.img.naturalHeight*sc);
  const c = document.createElement('canvas'); c.width=w; c.height=h; const g = c.getContext('2d', {willReadFrequently:true});
  g.drawImage(sy.img,0,0,w,h);
  const id = g.getImageData(0,0,w,h), d = id.data;
  // flatten uneven paper light, then keep only the pencil
  const lum = new Float32Array(w*h); for(let i=0;i<w*h;i++) lum[i] = d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114;
  const bw = 40, blur = new Float32Array(w*h);
  const sx = Math.max(1,Math.floor(w/bw)), sy2 = Math.max(1,Math.floor(h/bw));
  for(let y=0;y<h;y+=sy2) for(let x=0;x<w;x+=sx){ let mx=0; for(let yy=y;yy<Math.min(h,y+sy2);yy++) for(let xx=x;xx<Math.min(w,x+sx);xx++) mx=Math.max(mx,lum[yy*w+xx]);
    for(let yy=y;yy<Math.min(h,y+sy2);yy++) for(let xx=x;xx<Math.min(w,x+sx);xx++) blur[yy*w+xx]=mx; }
  const col = adjustLightness(hexOf(sy.colorKey), sy.l).match(/\d+/g).map(Number);
  const thr = sy.threshold/100;
  for(let i=0;i<w*h;i++){
    let r = lum[i]/Math.max(blur[i],1); if(sy.invert) r = 1-r;
    const a = clamp((thr - r)/0.12, 0, 1);
    d[i*4]=col[0]; d[i*4+1]=col[1]; d[i*4+2]=col[2]; d[i*4+3]=Math.round(a*255);
  }
  g.putImageData(id,0,0);
  sy.url = c.toDataURL('image/png'); sy.w = w*1000/Math.max(w,h); sy.h = h*1000/Math.max(w,h);
}

  optionsEl.innerHTML = '<h3>Animate</h3>';
  optionsEl.appendChild(checkRow('Animate the patch','Twinkling stars, a dot orbiting the oval, a pulsing star and a breathing shadow.',A.on,v=>{A.on=v;invalidate();}));
  optionsEl.appendChild(sliderRow('Speed',25,300,Math.round(A.speed*100),v=>(v/100).toFixed(2)+'×',v=>{A.speed=v/100;}));
  optionsEl.appendChild(checkRow('Twinkle','',A.twinkle,v=>{A.twinkle=v;}));
  optionsEl.appendChild(checkRow('Orbiting dot','',A.orbit,v=>{A.orbit=v;}));
  optionsEl.appendChild(checkRow('Star and shadow pulse','',A.pulse,v=>{A.pulse=v;}));
  const rec = mk('button','btn btn-primary opt-btn','Record 6 s video (WebM)'); rec.id='recBtn';
  rec.onclick = recordVideo; optionsEl.appendChild(rec);
  optionsEl.appendChild(mk('div','hint','The video is recorded on a solid backdrop matching the Light / Dark choice above the patch. The PNG and SVG downloads are always a still of the current frame.'));
}
async function recordVideo(){
  const btn = document.getElementById('recBtn');
  if(!window.MediaRecorder){ btn.textContent = 'Recording not supported in this browser'; return; }
  const was = state.animate.on; state.animate.on = true; invalidate();
  const px = 900, c = document.createElement('canvas'); c.width=px; c.height=px; const g = c.getContext('2d');
  const stream = c.captureStream(24);
  const rec = new MediaRecorder(stream, {mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'});
  const chunks = []; rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  const done = new Promise(r=>rec.onstop=r);
  rec.start();
  const t0 = performance.now(); let busy = false;
  const bg = state.backdrop==='dark' ? '#242426' : '#ffffff';
  await new Promise(resolve=>{
    const tick = async ()=>{
      const el = (performance.now()-t0)/1000;
      btn.textContent = 'Recording… ' + Math.min(6,el).toFixed(1) + ' s';
      if(el >= 6){ resolve(); return; }
      if(!busy){ busy = true;
        try{ const img = await svgToImage(buildSvg({fonts:true, size:px, t: el*state.animate.speed})); g.fillStyle=bg; g.fillRect(0,0,px,px); g.drawImage(img,0,0,px,px); }catch(e){}
        busy = false; }
      setTimeout(tick, 40);
    };
    tick();
  });
  rec.stop(); await done;
  const blob = new Blob(chunks, {type:'video/webm'});
  window.__lastVideo = blob;
  download(blob, 'mission-patch-animated.webm');
  state.animate.on = was; invalidate();
  btn.textContent = 'Record 6 s video (WebM)';
}

/* backdrop + theme */
document.querySelectorAll('#backdropSeg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#backdropSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.backdrop = b.dataset.b; invalidate();
}));
(function(){
  const root = document.documentElement; let theme = null;
  try{ theme = localStorage.getItem('patch-theme'); }catch(e){}
  if(theme!=='light' && theme!=='dark') theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  root.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    theme = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark'; root.setAttribute('data-theme', theme);
    try{ localStorage.setItem('patch-theme', theme); }catch(e){}
  });
})();

/* start */
Promise.all(LETTERS.filter(l=>l.fam).map(l=>document.fonts.load(`${l.w} 40px ${l.fam}`)).concat(LETTERS.filter(l=>l.v).map(l=>document.fonts.load(`400 40px ${l.fam}`))).concat([document.fonts.load('450 14px "Inter"')]))
  .catch(()=>{}).then(()=>{ fontsReady = true; invalidate(); });
document.querySelector('[data-filter="color"]').click();
requestAnimationFrame(loop);

/* =========================================================
   DRAG TO MOVE  (B, N, A, oval, star)
========================================================= */
const patchBox = () => patchEl.getBoundingClientRect();
function toDesign(e){ const r = patchBox(); return {x:(e.clientX-r.left)/r.width*1000, y:(e.clientY-r.top)/r.height*1000}; }
function starPos(){ const L = state.layout; return {x:OV0.x+L.ovalX-6+L.starX, y:OV0.y+L.ovalY+6+L.starY}; }
function hitTest(x,y){
  const L = state.layout, sketchB = state.bFont==='sketch', sketchN = state.nFont==='sketch';
  if(L.showStar){ const s = starPos(); if(Math.hypot(x-s.x,y-s.y) < Math.max(38*L.starScale,24)+8) return 'star'; }
  if(L.showOval){
    const th = L.ovalTilt*Math.PI/180, c = Math.cos(th), s = Math.sin(th);
    oc.setTransform(c,s,-s,c, OV0.x+L.ovalX, OV0.y+L.ovalY);
    const e = new Path2D(); e.ellipse(0,0,L.ovalA,L.ovalB,0,0,Math.PI*2);
    oc.lineWidth = 46; if(oc.isPointInStroke(e,x,y)) return 'oval';
  }
  const m = nMatrix();
  if(L.showN){
    if(sketchN){ oc.setTransform(...m); oc.lineWidth=(STROKE_NA+10)/m[0]; if(oc.isPointInStroke(Npath,x,y)) return 'n'; }
    else if(x>617*m[0]+m[4] && x<843*m[0]+m[4] && y>376*m[3]+m[5] && y<680*m[3]+m[5]) return 'n';
  }
  if(L.showA){
    const mm = [m[0],0,0,m[3], m[4]+L.aX*m[0], m[5]+L.aY*m[3]];
    if(Math.hypot(x-CX,y-CY) < R){
      if(sketchN){ oc.setTransform(...mm); oc.lineWidth=(STROKE_NA+10)/mm[0]; oc.lineJoin='round'; if(oc.isPointInStroke(Apath,x,y)) return 'a'; }
      else if(x>870*mm[0]+mm[4] && y>376*mm[3]+mm[5] && y<680*mm[3]+mm[5]) return 'a';
    }
  }
  const bs = L.bScale, x0 = BX0+L.bX, y0 = BY0+L.bY;
  if(sketchB){ oc.setTransform(bs,0,0,bs,x0,y0); if(oc.isPointInPath(Bpath,x,y,'evenodd')) return 'b'; oc.lineWidth = 10/bs; if(oc.isPointInStroke(Bpath,x,y)) return 'b'; }
  else if(x>x0 && x<x0+BW*1.2*bs && y>y0 && y<y0+BH*bs) return 'b';
  return null;
}
const TAGS = {b:'B', n:'N', a:'A', oval:'Oval', star:'Star'};
function bInside(L){
  const x0 = BX0+L.bX+Math.min(0,L.shDx), y1 = BY0+L.bY+BH*L.bScale+Math.max(0,L.shDy), y0 = BY0+L.bY;
  return Math.max(Math.hypot(x0-CX,y1-CY), Math.hypot(x0-CX,y0-CY)) <= 462;
}
function clampLayout(L){
  L.bX = clamp(L.bX,-120,160); L.bY = clamp(L.bY,-120,160);
  L.nX = clamp(L.nX,-150,150); L.nY = clamp(L.nY,-150,150); L.nScale = clamp(L.nScale,0.6,1.4);
  L.aX = clamp(L.aX,-150,100); L.aY = clamp(L.aY,-150,150);
  L.ovalX = clamp(L.ovalX,-160,160); L.ovalY = clamp(L.ovalY,-160,160);
  L.ovalA = clamp(L.ovalA,200,400); L.ovalB = clamp(L.ovalB,30,110); L.ovalTilt = clamp(L.ovalTilt,-90,90);
  L.starScale = clamp(L.starScale,0.5,2); L.starX = clamp(L.starX,-200,200); L.starY = clamp(L.starY,-200,200);
  const s = {x:OV0.x+L.ovalX-6+L.starX, y:OV0.y+L.ovalY+6+L.starY}, d = Math.hypot(s.x-CX,s.y-CY);
  if(d > 420){ const k = 420/d; L.starX -= s.x-(CX+(s.x-CX)*k); L.starY -= s.y-(CY+(s.y-CY)*k); }
}
let drag = null;
const tagEl = document.getElementById('dragTag');
function showTag(e, name){
  if(!name){ tagEl.classList.remove('on'); return; }
  const wr = patchEl.parentElement.getBoundingClientRect();
  tagEl.textContent = name; tagEl.style.left = (e.clientX-wr.left)+'px'; tagEl.style.top = (e.clientY-wr.top)+'px'; tagEl.classList.add('on');
}
patchEl.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  const p = toDesign(e), hit = hitTest(p.x,p.y);
  if(!hit) return;
  const L = state.layout;
  drag = {hit, p0:p, rotate: e.shiftKey && hit==='oval', start:Object.assign({}, L)};
  const oc0 = {x:OV0.x+L.ovalX, y:OV0.y+L.ovalY};
  drag.a0 = Math.atan2(p.y-oc0.y, p.x-oc0.x);
  dragging = true; patchEl.setPointerCapture(e.pointerId); patchEl.style.cursor = 'grabbing'; e.preventDefault();
});
patchEl.addEventListener('pointermove', e=>{
  const p = toDesign(e);
  if(!drag){
    const h = hitTest(p.x,p.y); patchEl.style.cursor = h ? 'grab' : 'default'; showTag(e, h ? TAGS[h] : null); return;
  }
  const L = state.layout, S = drag.start, dx = p.x-drag.p0.x, dy = p.y-drag.p0.y;
  showTag(e, drag.rotate ? 'Rotate oval' : 'Move '+TAGS[drag.hit]);
  switch(drag.hit){
    case 'b': {
      const keep = {bX:L.bX, bY:L.bY};
      L.bX = S.bX+dx; L.bY = S.bY+dy;
      if(!bInside(L)){ L.bY = keep.bY; if(!bInside(L)){ L.bX = keep.bX; L.bY = S.bY+dy; if(!bInside(L)){ L.bX = keep.bX; L.bY = keep.bY; } } }
      break; }
    case 'n': L.nX = S.nX+dx/ S.nScale; L.nY = S.nY+dy/ S.nScale; break;
    case 'a': L.aX = S.aX+dx/ S.nScale; L.aY = S.aY+dy/ S.nScale; break;
    case 'oval':
      if(drag.rotate){
        const oc0 = {x:OV0.x+L.ovalX, y:OV0.y+L.ovalY};
        L.ovalTilt = Math.round(S.ovalTilt + (Math.atan2(p.y-oc0.y,p.x-oc0.x)-drag.a0)*180/Math.PI);
      } else { L.ovalX = S.ovalX+dx; L.ovalY = S.ovalY+dy; }
      break;
    case 'star': L.starX = S.starX+dx; L.starY = S.starY+dy; break;
  }
  clampLayout(L); if(drag.hit==='b' && !bInside(L)) fitB();
  invalidate();
});
function endDrag(e){
  if(!drag) return;
  drag = null; dragging = false; patchEl.style.cursor = 'default'; showTag(e,null); invalidate();
  if(currentFilter==='layout') rerenderPanel();
}
patchEl.addEventListener('pointerup', endDrag);
patchEl.addEventListener('pointercancel', endDrag);
patchEl.addEventListener('pointerleave', e=>{ if(!drag) showTag(e,null); });
patchEl.addEventListener('wheel', e=>{
  const p = toDesign(e), hit = hitTest(p.x,p.y); if(!hit) return;
  e.preventDefault();
  const L = state.layout, k = Math.exp(-Math.sign(e.deltaY)*0.06);
  if(hit==='b'){ L.bScale = +clamp(L.bScale*k,0.5,1.4).toFixed(3); fitB(); }
  else if(hit==='n' || hit==='a'){ L.nScale = +clamp(L.nScale*k,0.6,1.4).toFixed(3); }
  else if(hit==='oval'){ L.ovalA = clamp(L.ovalA*k,200,400); L.ovalB = clamp(L.ovalB*k,30,110); }
  else if(hit==='star'){ L.starScale = +clamp(L.starScale*k,0.5,2).toFixed(3); }
  clampLayout(L); invalidate(); clearTimeout(wheelT); wheelT = setTimeout(()=>{ if(currentFilter==='layout') rerenderPanel(); }, 250);
}, {passive:false});
let wheelT = 0;

/* =========================================================
   LOCK DESIGN + TWEAK
========================================================= */
let locked = null;
const tw = {amount:40, letters:true, oval:true, star:true, stars:false, colours:false, type:false};
const clone = o => JSON.parse(JSON.stringify(o));
function snapshot(){
  return clone({roles:state.roles, bFont:state.bFont, nFont:state.nFont, bWeight:state.bWeight, nWeight:state.nWeight, layout:state.layout,
    texture:state.texture, border:state.border, density:state.density, crossPct:state.crossPct, dotScale:state.dotScale, ringText:state.ringText, seed:state.seed});
}
function restoreSnap(s){ const c = clone(s); Object.keys(c).forEach(k=>{ state[k] = c[k]; }); }
const lockBtn = document.getElementById('lockBtn'), genBtn = document.getElementById('generateBtn');
function syncLockUI(){
  lockBtn.textContent = locked ? 'Unlock' : 'Lock design';
  lockBtn.classList.toggle('locked', !!locked);
  genBtn.textContent = locked ? 'Tweak' : 'Generate';
  document.getElementById('lockFilter').textContent = locked ? 'Locked · tweak' : 'Lock & tweak';
}
function setLock(on){
  locked = on ? snapshot() : null;
  syncLockUI();
  if(on) document.querySelector('.filter-btn[data-filter="lock"]').click(); else rerenderPanel();
}
lockBtn.addEventListener('click', ()=> setLock(!locked));
function tweak(){
  if(!locked) return;
  restoreSnap(locked);
  const L = state.layout, a = tw.amount/100;
  const j = range => (Math.random()*2-1)*range*a;
  if(tw.letters){
    L.bX += j(50); L.bY += j(50); L.bScale = +clamp(L.bScale + j(0.14),0.6,1.2).toFixed(2);
    L.nX += j(50); L.nY += j(50); L.nScale = +(L.nScale + j(0.14)).toFixed(2); L.aX += j(50); L.aY += j(50);
  }
  if(tw.oval){ L.ovalTilt += j(30); L.ovalA += j(60); L.ovalB += j(16); L.ovalX += j(60); L.ovalY += j(60); }
  if(tw.star){ L.starX += j(70); L.starY += j(70); L.starScale = +(L.starScale + j(0.4)).toFixed(2); }
  if(tw.stars){ state.seed = Math.floor(Math.random()*1e9); state.density = Math.round(clamp(state.density + j(40),40,160)); }
  if(tw.colours){
    const roles = ['b','n','oval','star','stars','shadow'], count = a>0.6 ? 2 : 1;
    for(let i=0;i<count;i++){ const r = roles[Math.floor(Math.random()*roles.length)]; state.roles[r] = {key:PALETTE[Math.floor(Math.random()*PALETTE.length)].key, l:0}; }
  }
  if(tw.type){ const pick = ()=>LETTERS[Math.floor(Math.random()*LETTERS.length)].key; if(Math.random()<.6) { state.bFont = pick(); state.bWeight = null; } if(Math.random()<.6 || !tw.letters){ state.nFont = pick(); state.nWeight = null; } }
  Object.keys(L).forEach(k=>{ if(typeof L[k]==='number') L[k] = +L[k].toFixed(3); });
  clampLayout(L); fitB();
  invalidate(); rerenderPanel();
}
function pLock(){
  optionsEl.innerHTML = '<h3>Lock & tweak</h3>';
  if(!locked){
    optionsEl.appendChild(mk('div','hint','Found a design you like? Lock it. Generate then becomes Tweak: it makes small variations around your locked design instead of starting over, and you can always go back to it.'));
    const b = mk('button','btn btn-primary opt-btn','Lock this design'); b.onclick = ()=>setLock(true); optionsEl.appendChild(b);
    return;
  }
  optionsEl.appendChild(mk('div','hint','Design locked. Tweak varies only the parts ticked below, starting from the locked design each time.'));
  optionsEl.appendChild(sliderRow('Tweak amount',10,100,tw.amount,v=>v<=30?'Subtle':v<=65?'Medium':'Bold',v=>{ tw.amount=v; },5));
  optionsEl.appendChild(mk('label','field-label','Tweak these'));
  [['letters','Letters','B, N and A position and size'],['oval','Oval','tilt, length, thickness, position'],['star','Centre star','position and size'],
   ['stars','Star field','new dots and crosses'],['colours','Colours','swaps one or two colours'],['type','Typefaces','new fonts for B and NASA']].forEach(([k,n,note])=>
    optionsEl.appendChild(checkRow(n,note,tw[k],v=>{ tw[k]=v; })));
  const row = mk('div','btn-col');
  const mkb = (label, cls, fn)=>{ const b = mk('button','btn '+cls+' opt-btn',label); b.onclick = fn; row.appendChild(b); };
  mkb('Tweak','btn-primary', tweak);
  mkb('Update lock to this version','btn-secondary', ()=>{ locked = snapshot(); rerenderPanel(); });
  mkb('Back to locked design','btn-secondary', ()=>{ restoreSnap(locked); invalidate(); rerenderPanel(); });
  mkb('Unlock','btn-secondary', ()=>setLock(false));
  optionsEl.appendChild(row);
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape' && window.parent!==window){ try{ window.parent.postMessage('mission-patch-generator:close','*'); }catch(err){} } });

window.__patch = {state, hitTest, tweak, setLock, get locked(){return locked;}, buildSvg, generate, invalidate, get stars(){return starList;}, exportPng, fitB};
})();
