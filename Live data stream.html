  :root{
    --bg:#f5f5f7; --panel:#ffffff; --line:#e2e2e6; --text:#1d1d1f; --muted:#86868b;
    --accent:#0071e3; --live:#1a9d4a; --warn:#c77700;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
  }
  header{ padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header .title{ font-size:17px; font-weight:600; }
  header .sub{ font-size:12px; color:var(--muted); }
  .layout{ flex:1; display:flex; overflow:hidden; min-height:0; }

  .sidebar{ width:190px; padding:22px 14px; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; flex-shrink:0; }
  .sidebar h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px 6px; font-weight:600;}
  .filter-btn{
    display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px;
    border:none; border-radius:11px; background:var(--bg); color:var(--text);
    font-size:14px; font-weight:500; cursor:pointer; transition:background .15s; font-family:inherit;
  }
  .filter-btn:hover{ background:#eceef0; }
  .filter-btn.active{ background:var(--accent); color:#fff; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow:auto; min-width:0; }
  .canvas-wrap{ background:var(--panel); border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  canvas{ display:block; max-height:60vh; width:auto; max-width:100%; border-radius:6px; background:#fff; }
  .controls{ margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn{
    padding:12px 24px; border-radius:980px; border:none; font-size:14px; font-weight:600;
    cursor:pointer; transition:opacity .15s; font-family:inherit;
  }
  .btn:hover{ opacity:.85; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--panel); color:var(--accent); border:1px solid var(--accent); }
  .status{
    margin-top:12px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:980px; padding:7px 14px; max-width:100%;
  }
  .status .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status.live .dot{ background:var(--live); animation:pulse 1.6s ease-in-out infinite; }
  .status.warn .dot{ background:var(--warn); }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  .options{ width:280px; padding:22px 18px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; flex-shrink:0; }
  .options h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 14px; font-weight:600;}
  .options .empty{ color:var(--muted); font-size:13px; margin-top:40px; text-align:center; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.45; margin:6px 0 12px; }

  .swatch-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .swatch{ width:30px; height:30px; border-radius:9px; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
  .swatch.selected{ border-color:var(--accent); }
  .swatch-name{ font-size:13px; flex:1; }
  .swatch-slider{ width:100%; margin-top:4px; }

  .type-option{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  .type-option input{ width:18px; height:18px; margin-top:1px; flex-shrink:0; }
  .type-option small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; line-height:1.35; }

  label.field-label{ font-size:13px; color:var(--muted); display:block; margin:14px 0 6px; }
  input[type="range"]{ width:100%; }
  input[type="text"]{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-family:inherit; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .switch{ position:relative; width:44px; height:26px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-track{ position:absolute; cursor:pointer; inset:0; background:#d1d1d6; border-radius:999px; transition:.2s; }
  .slider-track:before{ content:""; position:absolute; width:22px; height:22px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider-track{ background:var(--accent); }
  .switch input:checked + .slider-track:before{ transform:translateX(18px); }
  .value-badge{ font-size:12px; color:var(--muted); float:right; }
  .opt-btn{ width:100%; margin-top:6px; }
  .data-detail{ font-size:12px; color:var(--text); background:var(--bg); border-radius:10px; padding:10px 12px; line-height:1.5; margin-bottom:6px; }

  .tip{
    position:fixed; z-index:50; pointer-events:none; background:rgba(29,29,31,.94); color:#fff; font-size:12px; line-height:1.45;
    padding:8px 11px; border-radius:9px; max-width:260px; opacity:0; transition:opacity .12s;
  }
  .tip.on{ opacity:1; }
  .tip b{ font-weight:600; }
</style>
</head>
<body>

<header>
  <span class="title">Quake Poster — live earthquakes</span>
  <span class="sub">USGS data drives the poster · built from the Das Schweizer Plakat generator (Weingart, 1984)</span>
</header>

<div class="layout">
  <div class="sidebar">
    <h3>Filter</h3>
    <button class="filter-btn" data-filter="data">Data</button>
    <button class="filter-btn" data-filter="color">Color</button>
    <button class="filter-btn" data-filter="type">Type</button>
    <button class="filter-btn" data-filter="texture">Texture</button>
    <button class="filter-btn" data-filter="border">Border</button>
    <button class="filter-btn" data-filter="text">Text</button>
    <button class="filter-btn" data-filter="upload">Upload</button>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="art" width="900" height="1273"></canvas>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="generateBtn">Generate</button>
      <button class="btn btn-secondary" id="replayBtn">Replay 24 h</button>
      <button class="btn btn-secondary" id="downloadBtn">Download PDF</button>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
  </div>

  <div class="options" id="options">
    <div class="empty">Select a filter to see its options.</div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
(() => {
'use strict';

/* =========================================================
   CONSTANTS
========================================================= */
const DAY = 864e5;
const HOUR = 36e5;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const PALETTE = [
  {key:'red',    name:'Red / Orange',    hex:'#E5482E'},
  {key:'yellow', name:'Golden Yellow',   hex:'#F2B705'},
  {key:'olive',  name:'Mustard / Olive', hex:'#9B8B1F'},
  {key:'green',  name:'Green',           hex:'#6E8B3D'},
  {key:'blue',   name:'Blue',            hex:'#3A6EA5'},
  {key:'black',  name:'Black',           hex:'#000000'},
  {key:'cream',  name:'Cream',           hex:'#F3EAD8'},
];
const FONTS = [
  {key:'archivo', label:'Archivo',           family:'"Archivo"',          weightH1:700},
  {key:'inter',   label:'Inter',             family:'"Inter"',            weightH1:700},
  {key:'bodoni',  label:'Bodoni Moda Italic',family:'"BodoniModaItalic"', weightH1:600},
];
const TEXTURES = [
  {key:'dots',       label:'Dot Screen / Polka Dot Grid'},
  {key:'screentone', label:'Screen Tone / Manga Tone'},
  {key:'lines',      label:'Line Screen / Engraving Lines'},
];
const BORDER_PATTERNS = [
  {key:'uniform',    label:'Uniform'},
  {key:'asymmetric', label:'Asymmetric'},
  {key:'circles',    label:'Circles'},
  {key:'triangles',  label:'Triangles'},
];
const FEEDS = [
  {key:'2.5_day', short:'M2.5+', label:'M2.5+ · larger quakes (default)'},
  {key:'4.5_day', short:'M4.5+', label:'M4.5+ · only the big ones'},
  {key:'all_day', short:'M1.0+', label:'M1.0+ · everything, mostly tiny'},
];
const XAXES = [
  {key:'lon',     label:'Longitude', note:'peaks sit where the quake happened, west to east'},
  {key:'time',    label:'Time',      note:'a 24-hour tape; the right edge is now'},
  {key:'mag',     label:'Magnitude', note:'peaks ranked small to large, like a skyline'},
  {key:'shuffle', label:'Shuffle on Generate', note:'Generate picks one of the three at random'},
];
const AXIS_CAPTION = {lon:'longitude', time:'time (right = now)', mag:'magnitude rank'};
const DRIVERS = [
  {key:'peaks',    label:'Peaks',          note:'one mountain per quake: height = magnitude, colour = depth'},
  {key:'sun',      label:'Sun, moon, cross', note:'sun = strongest quake, moon = newest, cross = USGS tsunami flag'},
  {key:'headline', label:'Headline',       note:'the poster text becomes the quake you pick in Text'},
  {key:'marks',    label:'Black marks',    note:'one mark per quake in the last hour'},
  {key:'texture',  label:'Texture activity', note:'busier Earth = coarser dots'},
  {key:'weight',   label:'Type weight',    note:'bigger quake = heavier headline'},
  {key:'shake',    label:'Shake on arrival', note:'the poster quivers when a M4+ quake lands'},
];

/* =========================================================
   STATE
========================================================= */
const state = {
  colors: {},
  font: 'archivo',
  textureType: 'dots',
  dotSize: 4,
  borderOn: true,
  borderSize: 40,
  borderColor: 'cream',
  borderPattern: 'uniform',
  text: 'Das Schweizer Plakat',
  textOpacity: 100,
  textSizePct: 100,
  headlineSource: 'largest',
  uploadedImg: null,
  feed: '2.5_day',
  xAxis: 'shuffle',
  replaySeconds: 60,
  activity: 60,
  drive: {peaks:true, sun:true, headline:true, marks:true, texture:true, weight:true, shake:true},
};
PALETTE.forEach(c => state.colors[c.key] = {selected:true, lightness:0});
let uploadVersion = 0;

const lay = {horizon:0.62, variant:0, xmode:'lon'};

/* =========================================================
   COLOR HELPERS
========================================================= */
function adjustLightness(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.min(255,Math.max(0,r+amt*2.3));
  g=Math.min(255,Math.max(0,g+amt*2.3));
  b=Math.min(255,Math.max(0,b+amt*2.3));
  return `rgb(${r|0},${g|0},${b|0})`;
}
function cssOf(key){
  const c = PALETTE.find(p=>p.key===key);
  return adjustLightness(c.hex, state.colors[key].lightness);
}
function selectedCss(keys){
  return keys.filter(k=>state.colors[k].selected).map(cssOf);
}
function palettes(){
  const red = cssOf('red');
  const bgCols = selectedCss(['red','yellow','black','cream']);
  const depthCols = selectedCss(['red','yellow','olive','green','blue']);
  const P = {
    bgCols: bgCols.length ? bgCols : [red],
    depthCols: depthCols.length ? depthCols : [red],
    cream: state.colors.cream.selected ? cssOf('cream') : '#F3EAD8',
    black: state.colors.black.selected ? cssOf('black') : '#000000',
  };
  P.warm = P.bgCols[0];
  P.sec = P.bgCols[1] || P.bgCols[0];
  const bk = state.colors[state.borderColor];
  P.borderCss = (bk && bk.selected) ? cssOf(state.borderColor) : P.cream;
  return P;
}
// shallow quakes take the first selected colour, deep quakes the last
function depthColor(depth, P){
  const n = Math.sqrt(clamp(depth/300, 0, 1));
  const len = P.depthCols.length;
  return P.depthCols[Math.min(len-1, Math.floor(n*len))];
}
function nearestColor(r,g,b, palette){
  let best = palette[0], bestDist = Infinity;
  for(const c of palette){
    let pr,pg,pb;
    if(c.startsWith('#')){ const n=parseInt(c.slice(1),16); pr=(n>>16)&255; pg=(n>>8)&255; pb=n&255; }
    else { const m=c.match(/[\d.]+/g); pr=+m[0]; pg=+m[1]; pb=+m[2]; }
    const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
    if(d < bestDist){ bestDist = d; best = c; }
  }
  return best;
}

/* =========================================================
   RANDOMNESS (re-seeded by Generate)
========================================================= */
let seed = Math.random()*1000;
function rand(n){ const x = Math.sin(n*12.9898 + seed*78.233)*43758.5453; return x-Math.floor(x); }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967295; }
function hrand(q,k){ return rand(q.h*977 + k*13.37); }

function reseed(first){
  seed = Math.random()*1000;
  lay.horizon = first ? 0.62 : 0.5 + rand(901)*0.2;
  lay.variant = first ? 0 : (rand(902) < 0.5 ? 0 : 1);
  if(state.xAxis === 'shuffle'){
    lay.xmode = first ? 'lon' : ['lon','lon','time','mag'][Math.floor(rand(903)*4)];
  } else {
    lay.xmode = state.xAxis;
  }
}

/* =========================================================
   DATA LAYER — USGS earthquake summary feed
   https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/{2.5|4.5|all}_day.geojson
   Updated by USGS about once a minute; we poll once a minute.
========================================================= */
const QUAKES = new Map();
const data = {usingSample:false, lastOk:0, nextAt:0, error:'', feedChanged:true, polling:false};
let epoch = 0;
const replay = {on:false, t0:0, startReal:0, dur:60000};

function parseFeature(f){
  const p = f.properties || {};
  const g = f.geometry && f.geometry.coordinates;
  if(!g || p.mag == null || (p.type && p.type !== 'earthquake')) return null;
  const id = String(f.id);
  return {
    id, h:hashStr(id), t:+p.time, mag:+p.mag,
    place:p.place || 'Unknown region',
    lon:+g[0], lat:+g[1], depth:Math.max(0, +g[2] || 0),
    tsunami:p.tsunami === 1, url:p.url || '',
    birth:0, fresh:false, shownIn:epoch,
  };
}
function ingest(parsedAsc, intro){
  const now = performance.now();
  if(intro){ QUAKES.clear(); }
  const seen = new Set();
  const step = Math.min(24, 3400/Math.max(1,parsedAsc.length));
  let i = 0;
  for(const q of parsedAsc){
    seen.add(q.id);
    const ex = QUAKES.get(q.id);
    if(ex){
      ex.mag=q.mag; ex.place=q.place; ex.lon=q.lon; ex.lat=q.lat; ex.depth=q.depth; ex.tsunami=q.tsunami; ex.url=q.url;
    } else {
      q.shownIn = epoch;
      q.birth = intro ? now + 350 + i*step : now;
      q.fresh = !intro;
      QUAKES.set(q.id, q);
      i++;
    }
  }
  for(const id of [...QUAKES.keys()]){ if(!seen.has(id)) QUAKES.delete(id); }
}

// Offline fallback: clearly labelled sample data, never presented as real quakes
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function makeSample(feedKey){
  const r = mulberry32(20261013);
  const now = Date.now();
  const zones = [[-75,-30,9],[140,36,8],[125,8,8],[-150,60,10],[-118,36,6],[160,-10,8],[28,38,5],[-72,-35,5],[95,3,6],[-100,17,6]];
  const n = feedKey==='all_day' ? 150 : feedKey==='4.5_day' ? 22 : 55;
  const minMag = feedKey==='all_day' ? 1.0 : feedKey==='4.5_day' ? 4.5 : 2.5;
  const out = [];
  for(let i=0;i<n;i++){
    const z = zones[Math.floor(r()*zones.length)];
    const mag = Math.round((minMag - Math.log10(1-r()*0.97))*10)/10;
    const id = 'sample-'+i;
    out.push({
      id, h:hashStr(id), t: now - r()*DAY*0.98, mag: Math.min(mag, 7.4),
      place:'Sample event '+(i+1), lon:z[0]+(r()-.5)*z[2]*2, lat:clamp(z[1]+(r()-.5)*z[2]*1.5,-85,85),
      depth: r()<0.72 ? r()*35 : r()*480, tsunami:false, url:'', birth:0, fresh:false, shownIn:epoch,
    });
  }
  return out.sort((a,b)=>a.t-b.t);
}
function loadSample(){
  ingest(makeSample(state.feed), true);
  data.usingSample = true;
}

async function poll(){
  if(data.polling) return;
  data.polling = true;
  const feed = state.feed;
  const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feed}.geojson`;
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 9000);
  try{
    const r = await fetch(url, {cache:'no-store', signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(feed !== state.feed) return;
    const parsed = (j.features||[]).map(parseFeature).filter(Boolean).sort((a,b)=>a.t-b.t);
    const intro = data.feedChanged || data.usingSample || QUAKES.size===0;
    ingest(parsed, intro);
    data.usingSample = false; data.feedChanged = false; data.lastOk = Date.now(); data.error = '';
  }catch(e){
    data.error = (e && e.name==='AbortError') ? 'timed out' : String((e && e.message) || e);
    if(!data.lastOk || data.feedChanged){ loadSample(); data.feedChanged = false; }
  }finally{
    clearTimeout(to);
    data.nextAt = Date.now() + 60000;
    data.polling = false;
  }
}
function changeFeed(key){
  state.feed = key; data.feedChanged = true; data.lastOk = 0; data.nextAt = 0;
  if(replay.on) stopReplay();
  poll();
}

/* ---------- clock + replay ---------- */
function startReplay(){
  replay.on = true; replay.t0 = Date.now()-DAY; replay.startReal = performance.now(); replay.dur = state.replaySeconds*1000;
  epoch++;
  for(const q of QUAKES.values()){ q.shownIn = null; q.fresh = false; }
  syncReplayBtn();
}
function stopReplay(){
  replay.on = false;
  for(const q of QUAKES.values()){ q.shownIn = epoch; }
  syncReplayBtn();
}
function syncReplayBtn(){ document.getElementById('replayBtn').textContent = replay.on ? 'Stop replay' : 'Replay 24 h'; }

function computeStats(vnow, now){
  const vis = [];
  for(const q of QUAKES.values()){
    if(now < q.birth) continue;
    if(replay.on){ if(q.shownIn !== epoch || q.t > vnow) continue; }
    vis.push(q);
  }
  vis.sort((a,b)=>a.t-b.t);
  let largest=null, newest=null, tsu=null;
  for(const q of vis){
    if(!largest || q.mag>largest.mag) largest=q;
    if(q.tsunami && (!tsu || q.mag>tsu.mag)) tsu=q;
  }
  newest = vis[vis.length-1] || null;
  const lastHour = vis.filter(q=>q.t >= vnow-HOUR);
  const last3 = vis.filter(q=>q.t >= vnow-3*HOUR).length;
  let activity = 1;
  if(vis.length >= 8){ activity = clamp((last3/3)/(vis.length/24), 0.25, 3); }
  return {vis, largest, newest, tsu, lastHour, activity, count:vis.length};
}

/* =========================================================
   CANVAS + LAYERS
========================================================= */
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
function makeLayer(){ const c=document.createElement('canvas'); c.width=W; c.height=H; return {c, x:c.getContext('2d'), sig:''}; }
const LBG = makeLayer(), LMID = makeLayer(), LFG = makeLayer(), LTXT = makeLayer();
const hits = [];
let fontsReady = false;

function computeInsets(b, pattern){
  if(pattern==='asymmetric'){
    return { top:b*(0.5+rand(301)*0.6), right:b*(0.9+rand(302)*0.8), bottom:b*(0.6+rand(303)*0.7), left:b*(0.5+rand(304)*0.6) };
  }
  return {top:b, right:b, bottom:b, left:b};
}

/* ---------- texture cell painter (dots / screentone / lines) ---------- */
function paintCell(g, x, y, size, colorCss, lum, textureType){
  g.fillStyle = colorCss;
  if(textureType==='lines'){
    const h = size*(0.35+(1-lum)*1.1);
    g.fillRect(x-size*1.1, y-h/2, size*2.2, h);
  } else if(textureType==='screentone'){
    const r = size*(0.18+(1-lum)*0.55);
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  } else {
    g.globalAlpha = 0.25+(1-lum)*0.5;
    const r = size*(0.2+(1-lum)*0.7);
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
}

let upCache = {key:'', data:null, w:0, h:0};
function sampleUpload(iw, ih){
  const key = uploadVersion+'|'+Math.round(iw)+'|'+Math.round(ih);
  if(upCache.key === key) return upCache;
  const off = document.createElement('canvas');
  off.width = Math.round(iw); off.height = Math.round(ih);
  const o = off.getContext('2d', {willReadFrequently:true});
  const img = state.uploadedImg;
  const sc = Math.max(off.width/img.width, off.height/img.height);
  const dw = img.width*sc, dh = img.height*sc;
  o.drawImage(img, (off.width-dw)/2, (off.height-dh)/2, dw, dh);
  upCache = {key, data:o.getImageData(0,0,off.width,off.height).data, w:off.width, h:off.height};
  return upCache;
}
function drawImageHalftone(g, ix, iy, iw, ihArea, cols, size, textureType){
  const s = sampleUpload(iw, ihArea);
  g.fillStyle = cols[cols.length-1] || '#F3EAD8';
  g.fillRect(ix, iy, iw, ihArea);
  for(let y=0; y<ihArea; y+=size*2.2){
    for(let x=0; x<iw; x+=size*2.2){
      const px = Math.min(s.w-1, Math.max(0, Math.round(x)));
      const py = Math.min(s.h-1, Math.max(0, Math.round(y)));
      const idx = (py*s.w+px)*4;
      const r=s.data[idx], gg=s.data[idx+1], b=s.data[idx+2];
      const lum = (r*0.299+gg*0.587+b*0.114)/255;
      let px2 = ix+x, py2 = iy+y;
      if(textureType==='dots'){ px2 += (rand(x+y)-.5)*size; py2 += (rand(y-x)-.5)*size; }
      paintCell(g, px2, py2, size, nearestColor(r,gg,b,cols), lum, textureType);
    }
  }
}

/* ---------- static layers (re-rendered only when their inputs change) ---------- */
function renderBG(P, R, dot){
  const g = LBG.x; g.clearRect(0,0,W,H);
  g.fillStyle = state.borderOn ? P.borderCss : P.cream; g.fillRect(0,0,W,H);
  const {ix,iy,iw,ih} = R;
  if(state.uploadedImg){
    drawImageHalftone(g, ix, iy, iw, ih*0.8, P.bgCols, dot, state.textureType);
    return;
  }
  const grad = g.createLinearGradient(0,iy,0,iy+ih);
  grad.addColorStop(0, P.warm);
  grad.addColorStop(.55, P.sec);
  grad.addColorStop(1, P.bgCols[2] || '#9B8B1F');
  g.fillStyle = grad;
  g.fillRect(ix,iy,iw,ih*0.8);
  for(let y=iy; y<iy+ih*0.8; y+=dot*2.2){
    for(let x=ix; x<ix+iw; x+=dot*2.2){
      const n = rand(x*0.013+y*0.027);
      const col = P.bgCols[Math.floor(n*P.bgCols.length)] || P.warm;
      let px=x, py=y;
      if(state.textureType==='dots'){ px += (rand(x+y)-.5)*dot; py += (rand(y-x)-.5)*dot; }
      paintCell(g, px, py, dot, col, 1-n, state.textureType);
    }
  }
  g.globalAlpha = 1;
}
// clouds sit in front of the peaks so the range rises out of them
function renderMID(P, R){
  const g = LMID.x; g.clearRect(0,0,W,H);
  const {ix,iy,iw,ih} = R;
  const count = 5 + Math.floor(rand(30)*3);
  for(let c=0;c<count;c++){
    const ccx = ix+iw*rand(40+c*3);
    const ccy = iy+ih*(lay.horizon-0.03 + rand(41+c*3)*0.26);
    const cr = iw*(0.05+rand(42+c*3)*0.09);
    g.fillStyle = `rgba(243,234,216,${0.35+rand(43+c)*0.35})`;
    for(let k=0;k<4;k++){
      g.beginPath();
      g.arc(ccx+(rand(44+c*5+k)-.5)*cr*1.6, ccy+(rand(45+c*5+k)-.5)*cr*0.8, cr*(0.5+rand(46+c*5+k)*0.6), 0, Math.PI*2);
      g.fill();
    }
  }
}
function renderFG(P, R, insets){
  const g = LFG.x; g.clearRect(0,0,W,H);
  const {ix,iy,iw,ih} = R;
  const b = state.borderOn ? state.borderSize : 0;
  if(b<=0) return;
  // torn corner (top-left)
  g.fillStyle = P.borderCss;
  g.beginPath();
  g.moveTo(ix, iy);
  g.lineTo(ix+iw*0.22, iy);
  g.lineTo(ix+iw*0.14, iy+ih*0.05);
  g.lineTo(ix+iw*0.2, iy+ih*0.08);
  g.lineTo(ix+iw*0.05, iy+ih*0.16);
  g.lineTo(ix, iy+ih*0.1);
  g.closePath(); g.fill();
  // bleeding checkerboard stripe on the right edge
  const stripeW = Math.min(b*0.8, insets.right*0.9), sq = b*0.3;
  for(let y=0; y<H; y+=sq){
    g.fillStyle = (Math.floor(y/sq)%2===0) ? P.warm : '#ffffff';
    g.fillRect(W-stripeW, y, stripeW, sq);
  }
  // circle / triangle trims
  if(state.borderPattern==='circles' || state.borderPattern==='triangles'){
    const n = Math.max(6, Math.floor(iw/(b*1.3)));
    g.fillStyle = P.black;
    for(let i=0;i<n;i++){
      const tx = insets.left + (iw/n)*(i+0.5);
      if(state.borderPattern==='circles'){
        g.beginPath(); g.arc(tx, insets.top/2, b*0.16, 0, Math.PI*2); g.fill();
        g.beginPath(); g.arc(tx, H-insets.bottom/2, b*0.16, 0, Math.PI*2); g.fill();
      } else {
        const tw = iw/n;
        g.beginPath(); g.moveTo(tx-tw*0.3, insets.top); g.lineTo(tx, insets.top*0.55); g.lineTo(tx+tw*0.3, insets.top); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(tx-tw*0.3, H-insets.bottom); g.lineTo(tx, H-insets.bottom*0.55); g.lineTo(tx+tw*0.3, H-insets.bottom); g.closePath(); g.fill();
      }
    }
  }
}

/* =========================================================
   DATA → SHAPES
========================================================= */
function makeXFn(vis, R, vnow){
  const mode = lay.xmode;
  if(mode==='time') return q => R.ix + R.iw*clamp((q.t-(vnow-DAY))/DAY, 0.03, 0.97);
  if(mode==='mag'){
    const sorted = vis.slice().sort((a,b)=>a.mag-b.mag);
    const rank = new Map(); sorted.forEach((q,i)=>rank.set(q.id,i));
    const n = Math.max(1, sorted.length);
    return q => R.ix + R.iw*(0.03+0.94*((rank.get(q.id)||0)+0.5)/n);
  }
  return q => R.ix + R.iw*clamp((q.lon+180)/360, 0.03, 0.97);
}
function growOf(q, now){
  if(reduceMotion) return now>=q.birth ? 1 : 0;
  const t = (now-q.birth)/900;
  if(t<=0) return 0;
  if(t>=1) return 1;
  const c1=1.4, c3=c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}
function latToY(lat, R){ return R.iy + R.ih*(0.07 + 0.40*(90-lat)/180); }

const apex = new Map();
function drawDataPeaks(stats, R, Lx, now, P){
  const baseY = R.iy + R.ih*lay.horizon;
  const maxH = R.ih*Math.min(0.46, lay.horizon-0.1);
  apex.clear();
  for(const q of stats.vis){
    const g = growOf(q, now); if(g<=0) continue;
    const m = Math.max(0.5, q.mag);
    const x = Lx(q);
    const h = maxH*(m/8)*g;
    const hw = R.iw*(0.008+0.0055*m);
    const ax = x + (hrand(q,1)-0.5)*hw*0.5, ay = baseY-h;
    const sx = x + hw*(0.2+0.3*hrand(q,2)), sy = ay + h*(0.28+0.2*hrand(q,3));
    ctx.beginPath(); ctx.moveTo(x-hw,baseY); ctx.lineTo(ax,ay); ctx.lineTo(sx,sy); ctx.lineTo(x+hw,baseY); ctx.closePath();
    ctx.fillStyle = depthColor(q.depth, P); ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(243,234,216,0.55)'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(sx,sy); ctx.lineTo(x+hw,baseY); ctx.lineTo(x+hw*0.1,baseY); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
    hits.push({k:'peak', q, x, hw, ay, by:baseY});
    apex.set(q.id, {x:ax, y:ay});
  }
}
function drawProcMountains(R){
  const peakCount = 3 + Math.floor(rand(1)*3);
  const baseY = R.iy + R.ih*lay.horizon;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.moveTo(R.ix+R.iw*0.1, baseY);
  for(let p=0; p<=peakCount; p++){
    const px = R.ix+R.iw*(0.1 + (0.8/peakCount)*p + (rand(10+p)-.5)*0.05);
    const py = baseY - R.ih*(0.1+rand(20+p)*0.35);
    ctx.lineTo(px, py);
  }
  ctx.lineTo(R.ix+R.iw*0.9, baseY); ctx.lineTo(R.ix+R.iw*0.1, baseY);
  ctx.closePath(); ctx.fill();
}
function crescent(x, y, r, color, P){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.arc(x+r*0.38, y-r*0.08, r*0.8, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill('evenodd');
  ctx.restore();
}
function drawBodies(stats, R, Lx, now, P){
  // sun = strongest quake in view; the disc sits at its longitude/latitude, tied to its peak by a hairline
  const big = stats.largest;
  if(state.drive.sun && big){
    const g = growOf(big, now);
    const rad = R.iw*(0.022+0.0125*Math.max(0.5,big.mag))*Math.max(0.05,g);
    const x = clamp(Lx(big), R.ix+rad, R.ix+R.iw-rad);
    const y = clamp(latToY(big.lat, R), R.iy+rad, R.iy+R.ih*0.6);
    const ap = apex.get(big.id);
    if(ap && state.drive.peaks){
      ctx.strokeStyle = 'rgba(243,234,216,0.85)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y+rad); ctx.lineTo(ap.x, ap.y); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
    ctx.fillStyle = depthColor(big.depth, P); ctx.fill();
    ctx.strokeStyle = P.sec; ctx.lineWidth = R.iw*0.011; ctx.stroke();
    hits.push({k:'disc', q:big, x, y, r:rad});
    // moon = newest quake
    const nw = stats.newest;
    if(nw){
      const mr = R.iw*(0.014+0.006*Math.max(0.5,nw.mag));
      let mx = clamp(Lx(nw), R.ix+mr, R.ix+R.iw-mr);
      let my = clamp(latToY(nw.lat, R), R.iy+mr, R.iy+R.ih*0.6);
      if(nw===big){ mx = clamp(mx - rad*2.2, R.ix+mr, R.ix+R.iw-mr); }
      crescent(mx, my, mr, depthColor(nw.depth, P), P);
      hits.push({k:'disc', q:nw, x:mx, y:my, r:mr*1.2});
    }
    // cross = strongest quake carrying USGS's tsunami flag
    const t = stats.tsu;
    if(t){
      const cs = R.iw*(0.014+0.004*Math.max(0.5,t.mag));
      const cx = clamp(Lx(t), R.ix+cs, R.ix+R.iw-cs), cy = clamp(latToY(t.lat,R), R.iy+cs, R.iy+R.ih*0.6);
      ctx.fillStyle = P.warm;
      ctx.fillRect(cx-cs/4, cy-cs, cs/2, cs*2); ctx.fillRect(cx-cs, cy-cs/4, cs*2, cs/2);
      hits.push({k:'disc', q:t, x:cx, y:cy, r:cs*1.2});
    }
  } else if(!state.drive.sun){
    const sunX = R.ix+R.iw*(0.08+rand(60)*0.84), sunY = R.iy+R.ih*(0.08+rand(61)*0.35), sunR = R.iw*(0.055+rand(62)*0.06);
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
    ctx.fillStyle = P.bgCols[2] || '#9B8B1F'; ctx.fill();
    ctx.strokeStyle = P.sec; ctx.lineWidth = R.iw*0.012; ctx.stroke();
    crescent(sunX - sunR*(1.6+rand(63)*1.2), sunY + sunR*(rand(64)-.5)*1.5, sunR*0.4, P.depthCols[Math.min(3,P.depthCols.length-1)], P);
    const cs = R.iw*0.03, cx = R.ix+R.iw*(0.15+rand(70)*0.75), cy = R.iy+R.ih*(0.15+rand(71)*0.3);
    ctx.fillStyle = P.warm; ctx.fillRect(cx-cs/4,cy-cs,cs/2,cs*2); ctx.fillRect(cx-cs,cy-cs/4,cs*2,cs/2);
  }
}
function drawMarks(stats, R, Lx, P){
  ctx.strokeStyle = P.black; ctx.lineWidth = 1.5;
  if(state.drive.marks){
    for(const q of stats.lastHour){
      const x = Lx(q), y = R.iy + R.ih*(0.08+0.4*hrand(q,5));
      const s = 8 + Math.max(0,q.mag)*3.2;
      ctx.beginPath();
      if(hrand(q,6) > 0.5){ ctx.moveTo(x,y); ctx.lineTo(x+s*0.6,y-s); ctx.lineTo(x+s,y+s*0.4); ctx.closePath(); }
      else { ctx.moveTo(x-s*0.5,y); ctx.lineTo(x+s*1.1,y+(hrand(q,7)-.3)*s*0.6); }
      ctx.stroke();
    }
  } else {
    for(let i=0;i<22;i++){
      const n = rand(i*3.7), mx = R.ix+R.iw*rand(i*1.3), my = R.iy+R.ih*0.75*rand(i*2.1);
      ctx.beginPath();
      if(n>0.66){ ctx.moveTo(mx,my); ctx.lineTo(mx+8*(n-.5)*14, my-10); ctx.lineTo(mx+6, my+6); ctx.closePath(); }
      else { ctx.moveTo(mx,my); ctx.lineTo(mx+(n-.5)*40, my+(n-.3)*18); }
      ctx.stroke();
    }
  }
}
function drawRipples(stats, R, now, P){
  if(reduceMotion || !state.drive.peaks) return;
  for(const q of stats.vis){
    if(!q.fresh) continue;
    const age = now-q.birth;
    if(age<0 || age>2400) continue;
    const ap = apex.get(q.id); if(!ap) continue;
    const k = age/2400;
    ctx.beginPath(); ctx.arc(ap.x, ap.y, R.iw*(0.01 + (0.05+0.012*Math.max(0.5,q.mag))*k), 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,0,0,${0.7*(1-k)})`; ctx.lineWidth = 2*(1-k)+0.5; ctx.stroke();
  }
}

/* =========================================================
   TEXT — the headline is a quake; the caption is the legend
========================================================= */
function cleanPlace(p){
  const s = (p||'').replace(/^\s*\d+(\.\d+)?\s*km\s+[NSEW]{1,3}\s+of\s+/i,'').trim();
  return s || 'Unknown region';
}
function ago(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if(s<60) return 'just now';
  const m = Math.round(s/60);
  if(m<60) return m+' min ago';
  const h = Math.floor(m/60);
  return h+' h '+(m%60)+' min ago';
}
function textModel(stats, vnow){
  const custom = !state.drive.headline || state.headlineSource==='custom';
  if(custom) return {kind:'custom', text:state.text};
  const q = state.headlineSource==='newest' ? stats.newest : stats.largest;
  if(!q) return {kind:'wait', l1:'M —', l2:'Waiting for data', h2:'', q:null};
  return {kind:'quake', q, l1:'M '+q.mag.toFixed(1), l2:cleanPlace(q.place), h2:Math.round(q.depth)+' km deep · '+ago(vnow-q.t)};
}
function holes(g, x, y, w, S, line){
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
  for(let k=0;k<3;k++){
    const px = x + w*rand(line*7+k*2.3+5);
    const py = y - S*(0.12+0.4*rand(line*3+k+9));
    const shape = Math.floor(rand(line+k*9+1)*3);
    if(shape===0){ g.beginPath(); g.arc(px,py,S*0.045,0,Math.PI*2); g.fill(); }
    else if(shape===1){ g.fillRect(px,py-S*0.03,S*0.07,S*0.06); }
    else { g.fillRect(px-S*0.015,py-S*0.04,S*0.03,S*0.08); g.fillRect(px-S*0.04,py-S*0.015,S*0.08,S*0.03); }
  }
  g.restore();
}
function fitSize(g, text, size, weight, family, maxW, minSize){
  g.font = `${weight} ${size}px ${family}`;
  const w = g.measureText(text).width;
  if(w <= maxW) return size;
  return Math.max(minSize, size*maxW/w);
}
function drawTextLayer(model, P, R){
  const g = LTXT.x; g.clearRect(0,0,W,H);
  const fd = FONTS.find(f=>f.key===state.font) || FONTS[0];
  const pct = state.textSizePct/100;
  g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.fillStyle = P.black;

  if(model.kind==='custom'){
    const words = state.text.trim().split(/\s+/);
    const S = R.iw*0.11*pct;
    let lines;
    if(words.length<=1) lines=[words[0]||'Art'];
    else if(words.length===2) lines=[words[0],words[1]];
    else lines=[words.slice(0,-1).join(' '), words[words.length-1]];
    let ly = R.iy + R.ih*0.86;
    lines.forEach((line,i)=>{
      const lx = (i===lines.length-1 && lines.length>1) ? R.ix+R.iw*0.5 : R.ix+R.iw*0.04;
      g.font = `${fd.weightH1} ${S}px ${fd.family}`;
      g.fillText(line, lx, ly);
      holes(g, lx, ly, g.measureText(line).width, S, i);
      ly += S*0.95;
    });
    return;
  }

  const q = model.q;
  const mn = q ? clamp((q.mag-2.5)/4.5, 0, 1) : 0.5;
  const wH = (state.drive.weight && q) ? Math.round(400+350*mn) : fd.weightH1;   // never heavier than 750
  const x1 = lay.variant===1 ? R.ix+R.iw*0.46 : R.ix+R.iw*0.04;
  const xl = R.ix+R.iw*0.04;
  const y1 = R.iy + R.ih*0.855;

  // line 1: magnitude — size follows the number, but never past the right margin
  let S1 = R.iw*0.20*(0.55+0.45*mn)*pct;
  S1 = fitSize(g, model.l1, S1, wH, fd.family, R.ix+R.iw*0.96-x1, 24);
  g.font = `${wH} ${S1}px ${fd.family}`;
  g.fillText(model.l1, x1, y1);
  holes(g, x1, y1, g.measureText(model.l1).width, S1, 0);

  // line 2: place — a long name forces the type smaller (the data pushes back on the type)
  let S2 = S1*0.46;
  const w2 = Math.max(400, wH-60);
  S2 = fitSize(g, model.l2, S2, w2, fd.family, R.iw*0.92, 12);
  g.font = `${w2} ${S2}px ${fd.family}`;
  const y2 = y1 + S2*0.95 + 8;
  g.fillText(model.l2, xl, y2);
  holes(g, xl, y2, g.measureText(model.l2).width, S2, 1);

  // subhead: depth and age
  if(model.h2){
    const S3 = clamp(R.iw*0.03*pct, 13, 42);
    g.font = `500 ${S3}px ${fd.family}`;
    g.fillText(model.h2, xl, y2 + S3*1.35);
  }
}
const FEED_SHORT = Object.fromEntries(FEEDS.map(f=>[f.key,f.short]));
function fmtClock(ms){ return new Date(ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtUTC(ms){ const d=new Date(ms); return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'); }
function captionLines(stats, vnow){
  const feed = FEED_SHORT[state.feed];
  const l1 = replay.on
    ? `REPLAY · ${fmtUTC(vnow)} UTC · ${stats.count} quakes · ${feed}`
    : `USGS · ${feed} · ${stats.count} quakes in the past 24 h`;
  const l2 = `height = magnitude · colour = depth · x = ${AXIS_CAPTION[lay.xmode]}`;
  let l3;
  if(replay.on) l3 = `24 h compressed into ${Math.round(replay.dur/1000)} s`;
  else if(data.usingSample) l3 = 'SAMPLE DATA · could not reach USGS';
  else if(data.lastOk) l3 = `updated ${fmtClock(data.lastOk)} · next in ${Math.max(0,Math.ceil((data.nextAt-Date.now())/1000))} s`;
  else l3 = 'connecting to USGS…';
  return [l1,l2,l3];
}

/* =========================================================
   RENDER LOOP
========================================================= */
let lastStats = null, lastVnow = Date.now(), lastR = null;
function render(now){
  let vnow = Date.now();
  if(replay.on){
    vnow = replay.t0 + (now-replay.startReal)/replay.dur*DAY;
    if(vnow >= Date.now()){ stopReplay(); vnow = Date.now(); }
    else {
      for(const q of QUAKES.values()){
        if(q.t<=vnow && q.shownIn!==epoch){ q.shownIn=epoch; q.birth=now; q.fresh=true; }
      }
    }
  }
  const stats = computeStats(vnow, now);
  lastStats = stats; lastVnow = vnow;

  const P = palettes();
  const b = state.borderOn ? state.borderSize : 0;
  const insets = state.borderOn ? computeInsets(b, state.borderPattern) : {top:0,right:0,bottom:0,left:0};
  const R = {ix:insets.left, iy:insets.top, iw:W-insets.left-insets.right, ih:H-insets.top-insets.bottom};
  lastR = R;
  const actMult = state.drive.texture ? clamp(1+(stats.activity-1)*(state.activity/100)*0.6, 0.6, 1.8) : 1;
  const dot = clamp(Math.round(state.dotSize*actMult*4)/4, 1, 14);

  const sigBG = JSON.stringify([seed,P.bgCols,P.borderCss,P.cream,state.textureType,dot,state.borderOn,R,!!state.uploadedImg,uploadVersion]);
  if(sigBG !== LBG.sig){ LBG.sig = sigBG; renderBG(P,R,dot); }
  const sigMID = JSON.stringify([seed,lay.horizon,R]);
  if(sigMID !== LMID.sig){ LMID.sig = sigMID; renderMID(P,R); }
  const sigFG = JSON.stringify([seed,P.borderCss,P.warm,P.black,state.borderOn,state.borderPattern,state.borderSize,R,insets]);
  if(sigFG !== LFG.sig){ LFG.sig = sigFG; renderFG(P,R,insets); }

  const model = textModel(stats, vnow);
  const sigTXT = JSON.stringify([model.kind, model.l1, model.l2, model.h2, model.text, state.font, state.textSizePct, state.drive.weight, lay.variant, seed, R, P.black, fontsReady]);
  if(sigTXT !== LTXT.sig){ LTXT.sig = sigTXT; drawTextLayer(model, P, R); }

  // shake: a short quiver when a M4+ quake lands
  let sx=0, sy=0;
  if(state.drive.shake && !reduceMotion){
    let amp = 0;
    for(const q of stats.vis){
      if(!q.fresh || q.mag<4) continue;
      const age = now-q.birth;
      if(age>=0 && age<500) amp = Math.max(amp, (q.mag-3.5)*2.2*(1-age/500));
    }
    sx = Math.sin(now*0.09)*amp; sy = Math.cos(now*0.11)*amp;
  }

  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  ctx.fillStyle = state.borderOn ? P.borderCss : P.cream; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);
  ctx.drawImage(LBG.c,0,0);
  hits.length = 0;
  const Lx = makeXFn(stats.vis, R, vnow);
  if(state.drive.peaks) drawDataPeaks(stats, R, Lx, now, P); else { apex.clear(); drawProcMountains(R); }
  ctx.drawImage(LMID.c,0,0);
  drawBodies(stats, R, Lx, now, P);
  drawMarks(stats, R, Lx, P);
  drawRipples(stats, R, now, P);
  ctx.drawImage(LFG.c,0,0);
  ctx.restore();

  ctx.globalAlpha = state.textOpacity/100;
  ctx.drawImage(LTXT.c,0,0);
  // caption / legend, fixed reduced opacity as in the original poster
  const fd = FONTS.find(f=>f.key===state.font) || FONTS[0];
  const capS = R.iw*0.0165;
  ctx.font = `500 ${capS}px ${fd.family}`; ctx.fillStyle = P.black; ctx.textAlign = 'right'; ctx.globalAlpha = 0.6;
  captionLines(stats, vnow).forEach((t,i)=> ctx.fillText(t, R.ix+R.iw*0.98, R.iy+R.ih*0.945 + i*capS*1.4));
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}
function loop(now){ render(now); requestAnimationFrame(loop); }

   STATUS + TOOLTIP
========================================================= */
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
function statusString(){
  const n = lastStats ? lastStats.count : 0;
  if(replay.on) return {cls:'live', t:`Replaying the last 24 h · ${fmtUTC(lastVnow)} UTC · ${n} quakes so far`};
  if(data.usingSample) return {cls:'warn', t:`Offline: showing SAMPLE data, not real quakes (${data.error||'no connection'}) · retrying in ${Math.max(0,Math.ceil((data.nextAt-Date.now())/1000))} s`};
  if(!data.lastOk) return {cls:'', t:'Connecting to USGS…'};
  const stale = data.error ? ' · last refresh failed, showing earlier data' : '';
  return {cls: data.error?'warn':'live', t:`Live · USGS ${FEED_SHORT[state.feed]} · ${n} quakes in 24 h · updated ${fmtClock(data.lastOk)} · next in ${Math.max(0,Math.ceil((data.nextAt-Date.now())/1000))} s${stale}`};
}
function updateStatus(){
  const s = statusString();
  statusEl.className = 'status ' + s.cls;
  statusText.textContent = s.t;
  const d = document.getElementById('dataDetail');
  if(d){
    const st = lastStats;
    const lg = st && st.largest ? `M${st.largest.mag.toFixed(1)} · ${cleanPlace(st.largest.place)}` : '—';
    const nw = st && st.newest ? `M${st.newest.mag.toFixed(1)} · ${cleanPlace(st.newest.place)} · ${ago(lastVnow-st.newest.t)}` : '—';
    d.innerHTML = `<b>${s.t.replace(/</g,'&lt;')}</b><br>Strongest: ${lg.replace(/</g,'&lt;')}<br>Newest: ${nw.replace(/</g,'&lt;')}<br>Activity: ${st ? st.activity.toFixed(2) : '1.00'}× (last 3 h vs 24 h average)`;
  }
}

const tip = document.getElementById('tip');
function canvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
function hitTest(cx, cy){
  for(let i=hits.length-1;i>=0;i--){
    const h = hits[i];
    if(h.k==='disc'){ if(Math.hypot(cx-h.x, cy-h.y) <= h.r+4) return h.q; }
    else if(cy>=h.ay && cy<=h.by){
      const f = (cy-h.ay)/Math.max(1,(h.by-h.ay));
      if(Math.abs(cx-h.x) <= h.hw*f+3) return h.q;
    }
  }
  return null;
}
canvas.addEventListener('mousemove', e=>{
  const p = canvasPoint(e);
  const q = hitTest(p.x, p.y);
  if(!q){ tip.classList.remove('on'); canvas.style.cursor='default'; return; }
  canvas.style.cursor = q.url ? 'pointer' : 'default';
  const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  tip.innerHTML = `<b>M${q.mag.toFixed(1)}</b> · ${esc(q.place)}<br>depth ${Math.round(q.depth)} km · ${ago(lastVnow-q.t)}${q.tsunami?'<br>USGS tsunami flag':''}${q.url?'<br><span style="opacity:.7">click to open the USGS page</span>':''}`;
  tip.style.left = Math.min(window.innerWidth-280, e.clientX+14)+'px';
  tip.style.top = (e.clientY+14)+'px';
  tip.classList.add('on');
});
canvas.addEventListener('mouseleave', ()=>tip.classList.remove('on'));
canvas.addEventListener('click', e=>{
  const p = canvasPoint(e);
  const q = hitTest(p.x, p.y);
  if(q && q.url) window.open(q.url, '_blank', 'noopener');
});

function renderTextPanel(){
  optionsEl.innerHTML = '<h3>Text</h3><label class="field-label">Headline shows</label>';
  [['largest','The strongest quake','of the past 24 h'],['newest','The newest quake','changes whenever a new one lands'],['custom','Custom text','type your own below']]
    .forEach(([k,l,n])=> optionsEl.appendChild(radioRow('headSrc', l, n, state.headlineSource===k, ()=>{ state.headlineSource=k; })));
  optionsEl.appendChild(mk('label','field-label','Custom text'));
  const input = document.createElement('input'); input.type='text'; input.value=state.text;
  input.oninput = e=>{ state.text = e.target.value; };
  optionsEl.appendChild(input);
  optionsEl.appendChild(sliderRow('Text opacity', 20, 100, state.textOpacity, v=>v+'%', v=>{ state.textOpacity=v; }));
  optionsEl.appendChild(sliderRow('Text size', 50, 150, state.textSizePct, v=>v+'%', v=>{ state.textSizePct=v; }));
}
function renderUploadPanel(){
  optionsEl.innerHTML = '<h3>Upload</h3><label class="field-label">Replace the poster background with your own photo, rendered in the active texture using the background colours. The quake peaks still draw on top.</label>';
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.style.cssText='width:100%;font-size:13px;margin-top:6px;';
  input.onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{ state.uploadedImg = img; uploadVersion++; renderUploadPanel(); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  optionsEl.appendChild(input);
  if(state.uploadedImg){
    const preview = document.createElement('img');
    preview.src = state.uploadedImg.src; preview.style.cssText='width:100%;border-radius:10px;margin-top:14px;display:block;';
    optionsEl.appendChild(preview);
    const rm = mk('button','btn btn-secondary opt-btn','Remove image');
    rm.style.marginTop='12px';
    rm.onclick = ()=>{ state.uploadedImg=null; uploadVersion++; renderUploadPanel(); };
    optionsEl.appendChild(rm);
  }
}

/* =========================================================
   BUTTONS
========================================================= */
function toggleReplay(){ if(replay.on) stopReplay(); else startReplay(); }
document.getElementById('generateBtn').addEventListener('click', ()=>{ reseed(false); if(currentFilter==='data') renderDataPanel(); });
document.getElementById('replayBtn').addEventListener('click', ()=>{ toggleReplay(); if(currentFilter==='data') renderDataPanel(); });
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  render(performance.now());
  const png = canvas.toDataURL('image/png');
  if(window.jspdf && window.jspdf.jsPDF){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'portrait', unit:'px', format:[W,H], hotfixes:['px_scaling']});
    doc.addImage(png, 'PNG', 0, 0, W, H);
    doc.save('quake-poster.pdf');
  } else {
    const a = document.createElement('a'); a.href = png; a.download = 'quake-poster.png'; a.click();
  }
});

reseed(true);
Promise.all(FONTS.map(f=>document.fonts.load(`600 24px ${f.family}`)).concat([document.fonts.load('500 16px "Inter"')]))
  .catch(()=>{}).then(()=>{ fontsReady = true; });
document.querySelector('[data-filter="data"]').click();
poll();
setInterval(()=>{ if(!data.polling && Date.now()>=data.nextAt) poll(); updateStatus(); }, 500);
requestAnimationFrame(loop);

window.__quake = {state, lay, QUAKES, data, replay, reseed, render, get stats(){return lastStats;}, get hits(){return hits;}, startReplay, stopReplay, poll, loadSample, ingest, parseFeature, fontsReady:()=>fontsReady};
})();
